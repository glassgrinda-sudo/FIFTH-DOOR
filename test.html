<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Canvas Test</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:red;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  background:blue;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;
ctx.fillStyle = "lime";
ctx.fillRect(100,100,300,300);
</script>
</body>
</html>
