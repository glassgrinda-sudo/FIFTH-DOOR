<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>

<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:monospace;
}
canvas { display:block; }

#hud {
  position:fixed;
  top:10px; left:10px;
  color:#fff;
  font-size:13px;
  opacity:0.85;
  z-index:5;
}

#hint {
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  color:#aaa;
  font-size:12px;
}
</style>
</head>

<body>

<div id="hud">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · Shift sprint · Esc unlock
</div>

<div id="hint">Click to lock mouse</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.045);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.35));

/* FLASHLIGHT — CORRECT IMPLEMENTATION */
const flashlight = new THREE.SpotLight(0xffffff, 3.2, 18, Math.PI/7, 0.35, 1);
flashlight.position.set(0,0,0);
camera.add(flashlight);

const flashlightTarget = new THREE.Object3D();
flashlightTarget.position.set(0,0,-1);
camera.add(flashlightTarget);
flashlight.target = flashlightTarget;

let flashlightOn = true;

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:1 });

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

wall(20,4,0,2,-10);
wall(20,4,-10,2,0,Math.PI/2);
wall(20,4,10,2,0,-Math.PI/2);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= FAKE PLAYER (TEST) ================= */
const fakePlayer = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.3,1.0,6,12),
  new THREE.MeshStandardMaterial({ color:0x552222 })
);
fakePlayer.position.set(2,1,-3);
scene.add(fakePlayer);

/* ================= CONTROLS ================= */
let keys = {};
let yaw = 0, pitch = 0;
let mouseLocked = false;

addEventListener("keydown", e=>{
  keys[e.code]=true;

  if(e.code==="KeyF"){
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 3.2 : 0;
  }
});

addEventListener("keyup", e=> keys[e.code]=false);

canvas.addEventListener("click", ()=>{
  canvas.requestPointerLock();
});

addEventListener("pointerlockchange", ()=>{
  mouseLocked = document.pointerLockElement === canvas;
});

addEventListener("mousemove", e=>{
  if(!mouseLocked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});

/* ================= GAME LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  camera.rotation.set(pitch, yaw, 0);

  let speed = keys["ShiftLeft"] ? 5 : 2.5;
  const dir = new THREE.Vector3();

  if(keys["KeyW"]) dir.z -= 1;
  if(keys["KeyS"]) dir.z += 1;
  if(keys["KeyA"]) dir.x -= 1;
  if(keys["KeyD"]) dir.x += 1;

  dir.normalize().applyEuler(camera.rotation);
  camera.position.addScaledVector(dir, speed * dt);

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
