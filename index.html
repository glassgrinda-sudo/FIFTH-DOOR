<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000,1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 15);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0,1.6,6);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222,0.4));

const flashlight = new THREE.SpotLight(0xffffff, 2, 10, Math.PI/7, 0.5);
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);

/* ================= ENVIRONMENT ================= */
const solidWalls = [];

function wall(w,h,d,x,y,z){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color:0x1a1a1a })
  );
  m.position.set(x,y,z);
  scene.add(m);
  solidWalls.push(m);
}

wall(12,4,0.5,0,2,-4);
wall(0.5,4,12,-6,2,-4);
wall(0.5,4,12,6,2,-4);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12,12),
  new THREE.MeshStandardMaterial({ color:0x111111 })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= INPUT ================= */
const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
canvas.onclick = () => canvas.requestPointerLock();

let yaw = 0;
let pitch = 0;

addEventListener("mousemove", e => {
  if (document.pointerLockElement !== canvas) return;

  // ✅ FIXED INVERSION
  yaw   -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));

  camera.rotation.set(pitch, yaw, 0);
});

/* ================= MOVEMENT + COLLISION ================= */
const velocity = new THREE.Vector3();

function canMove(pos){
  for (const w of solidWalls){
    if (pos.distanceTo(w.position) < 1) return false;
  }
  return true;
}

/* ================= CLOSET DRAGGER ================= */
const draggers = [];

function spawnDragger(x,z){
  const d = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.3,1.2),
    new THREE.MeshStandardMaterial({ color:0x330000 })
  );
  d.position.set(x,1,z);
  scene.add(d);
  draggers.push({
    mesh:d,
    dir:Math.random()*Math.PI*2,
    cooldown:0
  });
}

spawnDragger(-2,-2);
spawnDragger(2,-6);

/* ================= AUDIO ================= */
const listener = new THREE.AudioListener();
camera.add(listener);
const dragSound = new THREE.Audio(listener);
new THREE.AudioLoader().load("drag.mp3", b=>{
  dragSound.setBuffer(b);
  dragSound.setVolume(1);
});

/* ================= DRAG STATE ================= */
let dragged = false;
let dragTime = 0;

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (!dragged){
    const speed = keys["ShiftLeft"] ? 4 : 2;
    velocity.set(0,0,0);

    if (keys["KeyW"]) velocity.z -= speed * dt;
    if (keys["KeyS"]) velocity.z += speed * dt;
    if (keys["KeyA"]) velocity.x -= speed * dt;
    if (keys["KeyD"]) velocity.x += speed * dt;

    velocity.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const nextPos = camera.position.clone().add(velocity);
    if (canMove(nextPos)) camera.position.copy(nextPos);
  }

  /* === DRAGGER AI === */
  draggers.forEach(d=>{
    d.cooldown -= dt;
    d.mesh.position.x += Math.cos(d.dir)*dt*0.5;
    d.mesh.position.z += Math.sin(d.dir)*dt*0.5;

    if (Math.random()<0.01) d.dir += (Math.random()-0.5);

    const dist = d.mesh.position.distanceTo(camera.position);
    if (dist < 1.2 && !dragged && d.cooldown <= 0){
      dragged = true;
      dragTime = performance.now();
      d.cooldown = 5;
      flashlight.intensity = 0;
      if (dragSound.buffer) dragSound.play();
    }
  });

  if (dragged){
    camera.position.x += Math.sin(performance.now()*0.02)*0.05;
    if (performance.now() - dragTime > 1200){
      dragged = false;
      flashlight.intensity = 2;
    }
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
