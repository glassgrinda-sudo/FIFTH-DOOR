<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas { display:block; }
#ui {
  position:absolute;
  top:10px;
  left:10px;
  color:#ccc;
  font-family:Arial;
  font-size:14px;
  z-index:10;
}
</style>
</head>

<body>
<div id="ui">WASD move | Mouse look | F flashlight | Shift sprint</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000,1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 3, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,0);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 3.2, 18, Math.PI/7, 0.35, 1);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1b1b1b, roughness:0.9 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:1 });

/* ================= COLLISION ================= */
const colliders = [];

/* ================= ROOM BUILDER ================= */
function room(x,z,w=6,d=6,h=3){
  const y = h/2;

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(w,d),
    floorMat
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.set(x,0,z);
  scene.add(floor);

  const ceiling = floor.clone();
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = h;
  scene.add(ceiling);

  function wall(px,pz,rx){
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w,h),
      wallMat
    );
    m.position.set(px,y,pz);
    m.rotation.y = rx;
    scene.add(m);
    colliders.push(new THREE.Box3().setFromObject(m));
  }

  wall(x, z-d/2, 0);
  wall(x, z+d/2, Math.PI);
  wall(x-w/2, z, Math.PI/2);
  wall(x+w/2, z, -Math.PI/2);
}

/* ================= CORRIDOR ================= */
function corridor(x,z,len=6,dir="z"){
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(2,len),
    floorMat
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.set(x,0,z);
  if(dir==="x") floor.rotation.z = Math.PI/2;
  scene.add(floor);

  const ceiling = floor.clone();
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = 3;
  scene.add(ceiling);
}

/* ================= MAP ================= */
room(0,0);
corridor(0,-4);
room(0,-8);

corridor(4,0,"x");
room(8,0);

corridor(-4,0,"x");
room(-8,0);

/* ================= CONTROLS ================= */
let keys = {};
let yaw = 0;
let pitch = 0;
let speed = 0.05;

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyF") flashlight.visible = !flashlight.visible;
});
addEventListener("keyup",e=>keys[e.code]=false);

canvas.addEventListener("click",()=>{
  canvas.requestPointerLock();
});

addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==canvas) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002; // ✅ FIXED (not inverted)

  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

  camera.rotation.set(pitch, yaw, 0);
});

/* ================= MOVEMENT ================= */
function move(){
  let moveSpeed = keys["ShiftLeft"] ? 0.1 : speed;
  const dir = new THREE.Vector3();

  if(keys["KeyW"]) dir.z -= 1;
  if(keys["KeyS"]) dir.z += 1;
  if(keys["KeyA"]) dir.x -= 1;
  if(keys["KeyD"]) dir.x += 1;

  dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  const nextPos = camera.position.clone().addScaledVector(dir, moveSpeed);

  for(const box of colliders){
    if(box.containsPoint(nextPos)) return;
  }

  camera.position.copy(nextPos);
}

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);
  move();
  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
