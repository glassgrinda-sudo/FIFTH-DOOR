<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
canvas{display:block;width:100%;height:100%;}

#hud{
  position:absolute;
  bottom:20px;
  left:20px;
  color:#aaa;
  font-size:14px;
  z-index:5;
}

#menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  color:#ccc;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}
#menu.visible{display:flex;}
</style>
</head>

<body>

<div id="hud">WASD Move | Shift Sprint | Space Jump | F Flashlight | Esc Menu</div>

<div id="menu">
  <h2>PAUSED</h2>
  <p>WASD – Move</p>
  <p>Shift – Sprint</p>
  <p>Space – Jump</p>
  <p>F – Flashlight</p>
  <p>Esc – Resume / Leave</p>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const menu = document.getElementById("menu");

/* ================= RENDERER ================= */
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 18);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 1.6, 8);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI/7, 0.4);
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.visible = true;

/* ================= ENV ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x222222, roughness:0.9 });
function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}
wall(10,4,0,2,-6);
wall(10,4,-4,2,-2, Math.PI/2);
wall(10,4, 4,2,-2,-Math.PI/2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(8,40),
  new THREE.MeshStandardMaterial({ color:0x111111 })
);
floor.rotation.x = -Math.PI/2;
floor.position.z = -10;
scene.add(floor);

/* ================= FAKE PLAYER (AI) ================= */
const fakePlayer = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.3,1.2),
  new THREE.MeshStandardMaterial({ color:0x444444 })
);
fakePlayer.position.set(1,0.9,-5);
scene.add(fakePlayer);

let betrayalTriggered = false;

/* ================= PLAYER MOVEMENT ================= */
const keys = {};
let velocityY = 0;
let onGround = true;
let paused = false;

addEventListener("keydown",e=>{
  keys[e.code] = true;
  if(e.code==="KeyF") flashlight.visible = !flashlight.visible;
  if(e.code==="Escape"){
    paused = !paused;
    menu.classList.toggle("visible", paused);
  }
});
addEventListener("keyup",e=>keys[e.code]=false);

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  if(paused) return;

  const dt = clock.getDelta();

  // Forward drift (core idea preserved)
  camera.position.z -= 0.6 * dt;

  let speed = keys["ShiftLeft"] ? 4 : 2;
  if(keys["KeyW"]) camera.position.z -= speed * dt;
  if(keys["KeyS"]) camera.position.z += speed * dt;
  if(keys["KeyA"]) camera.position.x -= speed * dt;
  if(keys["KeyD"]) camera.position.x += speed * dt;

  if(keys["Space"] && onGround){
    velocityY = 4;
    onGround = false;
  }

  velocityY -= 9.8 * dt;
  camera.position.y += velocityY * dt;
  if(camera.position.y <= 1.6){
    camera.position.y = 1.6;
    velocityY = 0;
    onGround = true;
  }

  // Fake player stalking
  fakePlayer.position.z += Math.sin(performance.now()*0.001)*0.002;

  // Betrayal trigger
  const dist = camera.position.distanceTo(fakePlayer.position);
  if(dist < 1.2 && !betrayalTriggered){
    betrayalTriggered = true;
    flashlight.visible = false;
    camera.position.x += 1.5;
  }

  renderer.render(scene, camera);
}

animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
