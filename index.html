<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, sans-serif;
}
canvas{ display:block; }

#ui{
  position:absolute;
  top:20px;
  left:20px;
  color:#ccc;
  background:rgba(0,0,0,0.6);
  padding:10px 14px;
  border-radius:4px;
  z-index:10;
  font-size:14px;
}

#menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  color:#ccc;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:20;
  text-align:center;
}
#menu h2{ margin-bottom:20px; }
#menu p{ line-height:1.6; opacity:.8; }
#menu button{
  margin-top:20px;
  padding:10px 20px;
  background:#222;
  color:#ccc;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD Move · Mouse Look · F Flashlight · Shift Sprint · Esc Menu
</div>

<div id="menu">
<h2>PAUSED</h2>
<p>
WASD — Move<br>
Mouse — Look<br>
Shift — Sprint<br>
Space — Jump<br>
F — Flashlight<br>
Esc — Close Menu
</p>
<button onclick="toggleMenu()">Resume</button>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 3, 25);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(0, 1.6, 5);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.5));

const flashlight = new THREE.SpotLight(
  0xffffff, 2.5, 15, Math.PI / 6, 0.4, 1
);
flashlight.visible = true;
camera.add(flashlight);
camera.add(flashlight.target);

/* ================= SIMPLE BUILDING ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1b1b1b, roughness:0.9 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111 });

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.2), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

function room(x,z){
  wall(8,3,x,1.5,z-4);
  wall(8,3,x,1.5,z+4);
  wall(8,3,x-4,1.5,z,Math.PI/2);
  wall(8,3,x+4,1.5,z,-Math.PI/2);
}

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(50,50),
  floorMat
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* Rooms */
room(0,0);
room(0,-10);
room(10,0);
room(-10,0);

/* ================= PLAYER MOVEMENT ================= */
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();

let move = { forward:false, backward:false, left:false, right:false };
let sprint = false;
let canJump = true;
let flashlightOn = true;

/* ================= MOUSE LOOK ================= */
let pitch = 0, yaw = 0;
const sensitivity = 0.002;

document.body.addEventListener("click", ()=>{
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", e=>{
  if(document.pointerLockElement){
    yaw -= e.movementX * sensitivity;
    pitch -= e.movementY * sensitivity;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    camera.rotation.set(pitch, yaw, 0);
  }
});

/* ================= INPUT ================= */
document.addEventListener("keydown", e=>{
  if(e.code==="KeyW") move.forward=true;
  if(e.code==="KeyS") move.backward=true;
  if(e.code==="KeyA") move.left=true;
  if(e.code==="KeyD") move.right=true;
  if(e.code==="ShiftLeft") sprint=true;
  if(e.code==="Space" && canJump){
    velocity.y = 5;
    canJump = false;
  }
  if(e.code==="KeyF"){
    flashlightOn = !flashlightOn;
    flashlight.visible = flashlightOn;
  }
  if(e.code==="Escape"){
    toggleMenu();
  }
});

document.addEventListener("keyup", e=>{
  if(e.code==="KeyW") move.forward=false;
  if(e.code==="KeyS") move.backward=false;
  if(e.code==="KeyA") move.left=false;
  if(e.code==="KeyD") move.right=false;
  if(e.code==="ShiftLeft") sprint=false;
});

/* ================= MENU ================= */
const menu = document.getElementById("menu");
let paused = false;

function toggleMenu(){
  paused = !paused;
  menu.style.display = paused ? "flex" : "none";
  if(paused){
    document.exitPointerLock();
  } else {
    document.body.requestPointerLock();
  }
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if(!paused){
    direction.set(0,0,0);
    if(move.forward) direction.z -= 1;
    if(move.backward) direction.z += 1;
    if(move.left) direction.x -= 1;
    if(move.right) direction.x += 1;
    direction.normalize();

    const speed = sprint ? 6 : 3;
    velocity.x += direction.x * speed * dt;
    velocity.z += direction.z * speed * dt;

    camera.translateX(velocity.x * dt);
    camera.translateZ(velocity.z * dt);

    velocity.y -= 9.8 * dt;
    camera.position.y += velocity.y * dt;

    if(camera.position.y < 1.6){
