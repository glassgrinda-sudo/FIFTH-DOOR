<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR – EXPLORATION CORE</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
canvas{display:block;width:100%;height:100%;}

#hud{
  position:absolute;
  top:10px;
  left:10px;
  color:#aaa;
  font-size:14px;
  z-index:10;
}

#menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  color:#ccc;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:left;
  z-index:20;
}
#menu.visible{display:flex;}
#menu div{
  max-width:400px;
}
</style>
</head>
<body>

<div id="hud">WASD move | Mouse look | F flashlight | Shift sprint | Esc menu</div>

<div id="menu">
  <div>
    <h2>PAUSED</h2>
    <p>
      WASD – Move<br>
      Mouse – Look<br>
      Shift – Sprint<br>
      Space – Jump<br>
      F – Flashlight<br>
      Esc – Resume
    </p>
  </div>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const menu = document.getElementById("menu");

/* ================= RENDERER ================= */
const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x050505,1);

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 5, 25);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x404040,0.4));

const flashlight = new THREE.SpotLight(0xffffff,2,15,Math.PI/7,0.4,1);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
let flashlightOn = true;

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({color:0x1c1c1c,roughness:0.9});
const floorMat = new THREE.MeshStandardMaterial({color:0x111111,roughness:1});

function wall(w,h,x,y,z,ry=0){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wallMat);
  m.position.set(x,y,z);
  m.rotation.y=ry;
  scene.add(m);
}

function floor(w,d,x,z){
  const f=new THREE.Mesh(new THREE.PlaneGeometry(w,d),floorMat);
  f.rotation.x=-Math.PI/2;
  f.position.set(x,0,z);
  scene.add(f);
}

floor(10,30,0,-10);
wall(10,4,0,2,-25);
wall(30,4,-5,2,-10,Math.PI/2);
wall(30,4, 5,2,-10,-Math.PI/2);

/* ================= INPUT ================= */
const keys = {};
let paused = false;

document.addEventListener("keydown",e=>{
  keys[e.code]=true;

  if(e.code==="Escape"){
    paused = !paused;
    menu.classList.toggle("visible", paused);
    if(!paused) canvas.requestPointerLock();
    document.exitPointerLock();
  }

  if(e.code==="KeyF"){
    flashlightOn=!flashlightOn;
    flashlight.intensity = flashlightOn ? 2 : 0;
  }
});

document.addEventListener("keyup",e=>keys[e.code]=false);

/* ================= MOUSE LOOK ================= */
let pitch=0,yaw=0;
canvas.addEventListener("click",()=>canvas.requestPointerLock());

document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==canvas || paused) return;
  yaw -= e.movementX*0.002;
  pitch -= e.movementY*0.002;
  pitch = Math.max(-1.5,Math.min(1.5,pitch));
});

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
let onGround = true;

function updateMovement(dt){
  direction.set(0,0,0);
  if(keys.KeyW) direction.z -= 1;
  if(keys.KeyS) direction.z += 1;
  if(keys.KeyA) direction.x -= 1;
  if(keys.KeyD) direction.x += 1;

  direction.normalize();

  const speed = keys.ShiftLeft ? 6 : 3;

  velocity.x = direction.x * speed;
  velocity.z = direction.z * speed;

  if(keys.Space && onGround){
    velocity.y = 5;
    onGround = false;
  }

  velocity.y -= 9.8 * dt;

  camera.position.x += (Math.sin(yaw)*velocity.z + Math.cos(yaw)*velocity.x)*dt;
  camera.position.z += (Math.cos(yaw)*velocity.z - Math.sin(yaw)*velocity.x)*dt;
  camera.position.y += velocity.y*dt;

  if(camera.position.y<1.6){
    camera.position.y=1.6;
    velocity.y=0;
    onGround=true;
  }

  camera.rotation.set(pitch,yaw,0);
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if(!paused) updateMovement(dt);
  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
