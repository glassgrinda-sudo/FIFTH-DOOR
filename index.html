<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const statusEl = document.getElementById("status");

/* ================= RENDERER ================= */
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x040404,1);
renderer.physicallyCorrectLights = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 4, 22);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,60);
camera.position.set(0,1.7,9);
scene.add(camera);

/* ================= LIGHTING ================= */
// Ambient fill
scene.add(new THREE.AmbientLight(0x1a1a1a,0.25));

// Overhead practical
const ceilingLight = new THREE.PointLight(0xfff0d8, 18, 18, 2);
ceilingLight.position.set(0,3.4,-1);
ceilingLight.castShadow = true;
scene.add(ceilingLight);

// Door accent
const doorLight = new THREE.SpotLight(0xffd2aa, 35, 30, Math.PI/7, 0.5);
doorLight.position.set(0,3,-3);
doorLight.target.position.set(0,1.6,-6);
doorLight.castShadow = true;
scene.add(doorLight);
scene.add(doorLight.target);

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({
  color:0x202020,
  roughness:0.92,
  metalness:0.05
});

const floorMat = new THREE.MeshStandardMaterial({
  color:0x141414,
  roughness:0.85,
  metalness:0.02
});

const doorMat = new THREE.MeshStandardMaterial({
  color:0x5a1414,
  roughness:0.65,
  metalness:0.15
});

/* ================= HALLWAY ================= */
const hallway = new THREE.Mesh(
  new THREE.BoxGeometry(4.2,4,14),
  wallMat
);
hallway.position.z = -3;
hallway.receiveShadow = true;
scene.add(hallway);

/* ================= FLOOR ================= */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4.2,14),
  floorMat
);
floor.rotation.x = -Math.PI/2;
floor.position.set(0,0,-3);
floor.receiveShadow = true;
scene.add(floor);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(2,3.6,0.3),
  doorMat
);
door.position.set(0,1.8,-7);
door.castShadow = true;
scene.add(door);

/* ================= HAND ================= */
const hand = new THREE.Mesh(
  new THREE.BoxGeometry(.18,.28,.45),
  new THREE.MeshStandardMaterial({
    color:0x8a6a55,
    roughness:0.55,
    metalness:0.05
  })
);
hand.position.set(.42,-.42,-1);
hand.castShadow = true;
camera.add(hand);

/* ================= STATE ================= */
let started=false;
let enterTime=0;
let dragged=false;
let blackout=0;

/* ================= ENTER ================= */
function enterGame(){
  if(started) return;
  started=true;

  statusEl.textContent="Connected";
  overlay.classList.add("fade");

  document.documentElement.requestFullscreen?.();
  canvas.requestPointerLock?.();

  enterTime=performance.now();
}

/* ================= DRAG SEQUENCE ================= */
function triggerDrag(){
  if(dragged) return;
  dragged=true;
  blackout=performance.now();
}

/* ================= INPUT ================= */
addEventListener("keydown",e=>{
  if(e.code==="Space") enterGame();
});

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now()/1000;

  if(started){
    const t=(performance.now()-enterTime)/1000;

    // Forward push
    camera.position.z = THREE.MathUtils.lerp(9,4,Math.min(t/2,1));

    // Subtle head weight
    camera.position.y = 1.7 + Math.sin(now*0.6)*0.015;

    // Hand breath
    hand.position.y = -0.42 + Math.sin(now*1.8)*0.025;

    // Trigger DRAG near door
    if(camera.position.z < 5 && !dragged){
      setTimeout(triggerDrag, 800);
    }
  }

  // DRAG EFFECT
  if(dragged){
    const d = (performance.now()-blackout)/1000;

    // Camera violent yank
    camera.rotation.z = Math.sin(d*40)*0.04;
    camera.position.x = Math.sin(d*12)*0.25;

    // Light collapse
    ceilingLight.intensity = THREE.MathUtils.lerp(18,0,Math.min(d/0.4,1));
    doorLight.intensity = THREE.MathUtils.lerp(35,0,Math.min(d/0.4,1));

    // Blackout
    if(d > 0.35){
      renderer.setClearColor(0x000000,1);
    }
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
