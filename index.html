<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>

<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, sans-serif;
}

#ui {
  position:fixed;
  top:10px;
  left:10px;
  color:#eee;
  font-size:13px;
  z-index:10;
  opacity:0.85;
}

#hint {
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  color:#aaa;
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · Shift sprint · Esc unlock
</div>

<div id="hint">Click to lock mouse</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 2, 18);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  50
);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ================= LIGHTING ================= */

// soft ambient so nothing is pure black
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

// FLASHLIGHT
const flashlight = new THREE.SpotLight(
  0xffffff,
  2.5,
  20,
  Math.PI / 5,
  0.35,
  1
);
flashlight.castShadow = false;
scene.add(flashlight);
scene.add(flashlight.target);

/* ================= ENVIRONMENT ================= */

const wallMat = new THREE.MeshStandardMaterial({
  color:0x1a1a1a,
  roughness:0.95
});

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w,h),
    wallMat
  );
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

// simple corridor room
wall(10,4,0,2,-5);
wall(10,4,0,2,5,Math.PI);
wall(10,4,-5,2,0,Math.PI/2);
wall(10,4,5,2,0,-Math.PI/2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(10,10),
  new THREE.MeshStandardMaterial({ color:0x111111 })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= CONTROLS ================= */

let locked = false;
let flashlightOn = true;

const keys = {};
document.addEventListener("keydown", e => {
  keys[e.code] = true;

  if(e.code === "KeyF"){
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 2.5 : 0;
  }
});
document.addEventListener("keyup", e => keys[e.code] = false);

document.body.addEventListener("click", () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === renderer.domElement;
  document.getElementById("hint").style.display = locked ? "none" : "block";
});

let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", e => {
  if(!locked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});

/* ================= LOOP ================= */

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // camera rotation
  camera.rotation.set(pitch, yaw, 0, "YXZ");

  // movement
  const speed = keys["ShiftLeft"] ? 4 : 2;
  const dir = new THREE.Vector3();

  if(keys["KeyW"]) dir.z -= 1;
  if(keys["KeyS"]) dir.z += 1;
  if(keys["KeyA"]) dir.x -= 1;
  if(keys["KeyD"]) dir.x += 1;

  dir.normalize().applyEuler(camera.rotation);
  camera.position.addScaledVector(dir, speed * dt);

  // FLASHLIGHT FIX (this is the important part)
  flashlight.position.copy(camera.position);
  flashlight.target.position.set(
    camera.position.x + Math.sin(yaw),
    camera.position.y + Math.sin(pitch),
    camera.position.z + Math.cos(yaw)
  );
  flashlight.target.updateMatrixWorld();

  renderer.render(scene, camera);
}

animate();

/* ================= RESIZE ================= */

window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
