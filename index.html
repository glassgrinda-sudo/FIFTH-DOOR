<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#ui {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #ccc;
  background: rgba(0,0,0,0.6);
  padding: 10px 14px;
  border-radius: 4px;
  z-index: 10;
}

#overlay {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #aaa;
  font-size: 20px;
  z-index: 20;
  transition: opacity 1s ease;
}

#overlay.fade {
  opacity: 0;
  pointer-events: none;
}

#overlay small {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div id="ui">
  <b>FIFTH DOOR</b><br>
  <span id="status">Waiting…</span>
</div>

<div id="overlay">
  <div>PRESS SPACE TO ENTER</div>
  <small>Some doors only open when you choose.</small>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script>
/* ================= SETUP ================= */
const canvas   = document.getElementById("c");
const overlay  = document.getElementById("overlay");
const statusEl = document.getElementById("status");

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x050505, 1);

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 3, 20);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  50
);
camera.position.set(0, 1.6, 8);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.5));

const light = new THREE.PointLight(0xfff2cc, 1, 20);
light.position.set(0, 3, 2);
scene.add(light);

/* ================= HALLWAY (PLANES) ================= */
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x1c1c1c,
  roughness: 0.95
});

const leftWall = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 4),
  wallMat
);
leftWall.position.set(-2, 2, -2);
leftWall.rotation.y = Math.PI / 2;
scene.add(leftWall);

const rightWall = leftWall.clone();
rightWall.position.x = 2;
rightWall.rotation.y = -Math.PI / 2;
scene.add(rightWall);

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 4),
  wallMat
);
backWall.position.set(0, 2, -8);
scene.add(backWall);

/* ================= FLOOR ================= */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 12),
  new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, -2);
scene.add(floor);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(2, 3.5, 0.25),
  new THREE.MeshStandardMaterial({ color: 0x4a0e0e, roughness: 0.7 })
);
door.position.set(0, 1.75, -6);
scene.add(door);

/* ================= HAND ================= */
const hand = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 0.3, 0.5),
  new THREE.MeshStandardMaterial({ color: 0x7a5a4a })
);
hand.position.set(0.4, -0.4, -1);
camera.add(hand);

/* ================= STATE ================= */
let started = false;
let enterTime = 0;

/* ================= ENTER ================= */
function enterGame() {
  if (started) return;
  started = true;
  statusEl.textContent = "Connected";
  overlay.classList.add("fade");
  enterTime = performance.now();
}

window.addEventListener("keydown", e => {
  if (e.code === "Space") enterGame();
});

/* ================= LOOP ================= */
function animate() {
  requestAnimationFrame(animate);

  if (started) {
    const t = (performance.now() - enterTime) / 1000;
    camera.position.z = THREE.MathUtils.lerp(8, 3, Math.min(t / 2, 1));
    hand.position.y = -0.4 + Math.sin(t * 1.5) * 0.02;
  }

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
