<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, sans-serif;
}
canvas { display:block; }

#hud {
  position:fixed;
  top:12px;
  left:12px;
  color:#ccc;
  font-size:13px;
  z-index:10;
  pointer-events:none;
}
#hint {
  position:fixed;
  bottom:14px;
  width:100%;
  text-align:center;
  color:#666;
  font-size:12px;
}
</style>
</head>
<body>

<div id="hud">
<b>FIFTH DOOR</b><br>
WASD Move · Mouse Look · F Flashlight · Shift Sprint · Esc Unlock
</div>
<div id="hint">Click to lock mouse</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505,1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 2, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);

scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x404040,0.3));

const flashlight = new THREE.SpotLight(
  0xffffff,
  2.2,
  18,
  Math.PI/7,
  0.5,
  1
);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);

let flashlightOn = true;

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.9 });

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

wall(20,4, 0,2,-10);
wall(20,4,-10,2,0, Math.PI/2);
wall(20,4, 10,2,0,-Math.PI/2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  floorMat
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= INPUT ================= */
const keys = {};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyF"){
    flashlightOn=!flashlightOn;
    flashlight.intensity = flashlightOn ? 2.2 : 0;
  }
});
addEventListener("keyup",e=>keys[e.code]=false);

/* ================= POINTER LOCK ================= */
canvas.addEventListener("click",()=>{
  canvas.requestPointerLock();
});

let yaw=0, pitch=0;
addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==canvas) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
});

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();

function updateMovement(dt){
  const speed = keys["ShiftLeft"] ? 6 : 3;

  velocity.set(0,0,0);
  if(keys["KeyW"]) velocity.z -= speed * dt;
  if(keys["KeyS"]) velocity.z += speed * dt;
  if(keys["KeyA"]) velocity.x -= speed * dt;
  if(keys["KeyD"]) velocity.x += speed * dt;

  const dir = new THREE.Vector3(velocity.x,0,velocity.z);
  dir.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  camera.position.add(dir);
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  updateMovement(dt);

  camera.rotation.set(pitch,yaw,0,"YXZ");

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
