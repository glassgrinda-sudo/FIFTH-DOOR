<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR – BASELINE</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
#label{
  position:absolute;
  top:20px;
  left:20px;
  color:#0f0;
  font-family:monospace;
  z-index:10;
}
</style>
</head>
<body>

<div id="label">RUNNING</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 12);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  50
);
camera.position.set(0, 1.6, 8);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

wall(10,4, 0,2,-5);
wall(10,4,-3,2,-2, Math.PI/2);
wall(10,4, 3,2,-2,-Math.PI/2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(6,20),
  new THREE.MeshStandardMaterial({ color:0x111111 })
);
floor.rotation.x = -Math.PI/2;
floor.position.z = -4;
scene.add(floor);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(2,3,0.2),
  new THREE.MeshStandardMaterial({ color:0x550000 })
);
door.position.set(0,1.5,-10);
scene.add(door);

/* ================= AUTO-START MOTION ================= */
let z = 8;

function animate(){
  requestAnimationFrame(animate);

  // THIS LINE IS THE PROOF OF LIFE
  z -= 0.03;
  camera.position.z = z;

  renderer.render(scene, camera);
}

animate();

/* ================= RESIZE ================= */
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
