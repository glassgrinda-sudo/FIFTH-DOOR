<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#ui{
position:fixed;top:10px;left:10px;
color:#ddd;font-family:monospace;font-size:14px;
z-index:10
}
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · E open door · F flashlight · Esc unlock
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 18);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,0);

/* ================= RENDERER ================= */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2, 10, Math.PI/6, 0.4);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= INPUT ================= */
let keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

/* ================= MOUSE LOOK (FIXED) ================= */
let yaw = 0, pitch = 0;
const pitchLimit = Math.PI/2 - 0.05;

renderer.domElement.addEventListener("click",()=>{
  renderer.domElement.requestPointerLock();
});

addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==renderer.domElement) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-pitchLimit, Math.min(pitchLimit, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

/* ================= GEOMETRY ================= */
const wallMat = new THREE.MeshStandardMaterial({color:0x1a1a1a});
const floorMat = new THREE.MeshStandardMaterial({color:0x111111});
const doorMat = new THREE.MeshStandardMaterial({color:0x4a0e0e});

const colliders = [];
const doors = [];

function wall(w,h,d,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
  m.position.set(x,y,z);
  scene.add(m);
  colliders.push(m);
}

function floor(w,d,x,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d), floorMat);
  m.position.set(x,0,z);
  scene.add(m);
}

function door(x,z){
  const pivot = new THREE.Object3D();
  pivot.position.set(x-0.5,1,z);
  const d = new THREE.Mesh(new THREE.BoxGeometry(1,2,0.15), doorMat);
  d.position.set(0.5,0,0);
  pivot.add(d);
  pivot.open=false;
  scene.add(pivot);
  doors.push(pivot);
}

/* ================= ROOM 1 ================= */
floor(6,6,0,-3);
wall(6,3,0.2,0,1.5,-6);
wall(6,3,0.2,0,1.5,0);
wall(0.2,3,6,-3,1.5,-3);
wall(0.2,3,2,3,1.5,-5);
wall(0.2,3,2,3,1.5,-1);
door(3,-3);

/* ================= CORRIDOR ================= */
floor(2,4,5,-3);
wall(2,3,0.2,5,1.5,-5);
wall(2,3,0.2,5,1.5,-1);
wall(0.2,3,4,4,1.5,-3);
wall(0.2,3,4,6,1.5,-3);

/* ================= ROOM 2 ================= */
floor(6,6,9,-3);
wall(6,3,0.2,9,1.5,-6);
wall(6,3,0.2,9,1.5,0);
wall(0.2,3,6,6,1.5,-3);
wall(0.2,3,6,12,1.5,-3);

/* ================= FLASHLIGHT ================= */
let lightOn=true;
addEventListener("keydown",e=>{
  if(e.code==="KeyF"){
    lightOn=!lightOn;
    flashlight.intensity = lightOn ? 2 : 0;
  }
});

/* ================= DOOR INTERACTION ================= */
addEventListener("keydown",e=>{
  if(e.code!=="KeyE") return;
  doors.forEach(d=>{
    const dist = d.position.distanceTo(camera.position);
    if(dist<2){
      d.open=!d.open;
    }
  });
});

/* ================= MOVEMENT + COLLISION ================= */
const speed = 0.05;

function blocked(pos){
  for(const c of colliders){
    const b = new THREE.Box3().setFromObject(c);
    if(b.containsPoint(pos)) return true;
  }
  return false;
}

function move(){
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y=0; dir.normalize();

  const right = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

  let delta = new THREE.Vector3();

  if(keys.KeyW) delta.add(dir);
  if(keys.KeyS) delta.sub(dir);
  if(keys.KeyA) delta.add(right);
  if(keys.KeyD) delta.sub(right);

  delta.normalize().multiplyScalar(speed);

  const next = camera.position.clone().add(delta);
  if(!blocked(next)) camera.position.copy(next);
}

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);
  move();

  doors.forEach(d=>{
    d.rotation.y += ((d.open?-Math.PI/2:0)-d.rotation.y)*0.1;
  });

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
