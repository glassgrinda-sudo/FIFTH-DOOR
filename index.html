<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR – Core Build</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #aaa;
  font-family: Arial, sans-serif;
  font-size: 14px;
  z-index: 10;
}
</style>
</head>

<body>
<div id="ui">WASD move | Mouse look | F flashlight | E door | Shift sprint</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 18);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

/* ================= PLAYER ================= */
const player = new THREE.Object3D();
player.position.set(0, 1.6, 0);
scene.add(player);
player.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(
  0xffffff,
  2.2,     // brightness
  15,
  Math.PI / 6,
  0.4,
  1
);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);

/* ================= INPUT ================= */
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

let flashlightOn = true;
document.addEventListener("keydown", e => {
  if (e.code === "KeyF") {
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 2.2 : 0;
  }
});

/* ================= MOUSE LOOK (FIXED) ================= */
let yaw = 0;
let pitch = 0;

document.body.addEventListener("click", () => {
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== document.body) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;

  pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));

  player.rotation.y = yaw;
  camera.rotation.x = pitch;
});

/* ================= COLLISION ================= */
const colliders = [];

function box(w,h,d,x,y,z) {
  const geo = new THREE.BoxGeometry(w,h,d);
  const mat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x,y,z);
  scene.add(mesh);
  colliders.push(mesh);
  return mesh;
}

/* ================= MAP ================= */
// Floor
box(30, 1, 30, 0, -0.5, 0);
// Ceiling
box(30, 1, 30, 0, 3.5, 0);

// Main room
box(30, 4, 1, 0, 1.5, -15);
box(30, 4, 1, 0, 1.5, 15);
box(1, 4, 30, -15, 1.5, 0);
box(1, 4, 30, 15, 1.5, 0);

// Corridor
box(6, 4, 1, 0, 1.5, -6);
box(1, 4, 6, -3, 1.5, -3);
box(1, 4, 6, 3, 1.5, -3);

// Back room
box(10, 4, 1, 0, 1.5, -12);
box(10, 4, 1, 0, 1.5, -18);
box(1, 4, 6, -5, 1.5, -15);
box(1, 4, 6, 5, 1.5, -15);

/* ================= DOOR ================= */
const doorPivot = new THREE.Object3D();
doorPivot.position.set(0,1.5,-6);
scene.add(doorPivot);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(1,3,0.2),
  new THREE.MeshStandardMaterial({ color:0x552222 })
);
door.position.set(0.5,0,0);
doorPivot.add(door);

let doorOpen = false;
document.addEventListener("keydown", e => {
  if (e.code === "KeyE") {
    doorOpen = !doorOpen;
  }
});

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();

function canMove(pos) {
  for (const c of colliders) {
    const b1 = new THREE.Box3().setFromObject(c);
    const b2 = new THREE.Box3().setFromCenterAndSize(
      pos,
      new THREE.Vector3(0.6,1.6,0.6)
    );
    if (b1.intersectsBox(b2)) return false;
  }
  return true;
}

/* ================= LOOP ================= */
function animate() {
  requestAnimationFrame(animate);

  // Door animation
  doorPivot.rotation.y += (doorOpen ? -Math.PI/2 : 0 - doorPivot.rotation.y) * 0.1;

  const speed = keys["ShiftLeft"] ? 0.08 : 0.045;
  velocity.set(0,0,0);

  if (keys["KeyW"]) velocity.z -= speed;
  if (keys["KeyS"]) velocity.z += speed;
  if (keys["KeyA"]) velocity.x -= speed;
  if (keys["KeyD"]) velocity.x += speed;

  velocity.applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation.y);

  const nextPos = player.position.clone().add(velocity);
  if (canMove(nextPos)) player.position.copy(nextPos);

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.inne
