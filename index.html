<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: monospace;
}
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #ccc;
  font-size: 14px;
  z-index: 10;
}
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · E open door · F flashlight
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155/examples/js/controls/PointerLockControls.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020202);
scene.fog = new THREE.Fog(0x020202, 3, 25);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 5);

/* ================= CONTROLS ================= */
const controls = new THREE.PointerLockControls(camera, document.body);
document.body.addEventListener("click", () => controls.lock());

let move = { f:0, b:0, l:0, r:0 };
let velocity = new THREE.Vector3();

addEventListener("keydown", e=>{
  if(e.code==="KeyW") move.f=1;
  if(e.code==="KeyS") move.b=1;
  if(e.code==="KeyA") move.l=1;
  if(e.code==="KeyD") move.r=1;
});
addEventListener("keyup", e=>{
  if(e.code==="KeyW") move.f=0;
  if(e.code==="KeyS") move.b=0;
  if(e.code==="KeyA") move.l=0;
  if(e.code==="KeyD") move.r=0;
});

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.3));

const flashlight = new THREE.SpotLight(0xffffff, 2, 15, Math.PI/6, 0.4);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

let lightOn = true;
addEventListener("keydown", e=>{
  if(e.code==="KeyF"){
    lightOn = !lightOn;
    flashlight.intensity = lightOn ? 2 : 0;
  }
});

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a0e0e });

/* ================= COLLISION ================= */
const colliders = [];
function addCollider(mesh){ colliders.push(mesh); }

/* ================= ROOMS & CORRIDORS ================= */
function room(x,z,w,d){
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w,d), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.set(x,0,z);
  scene.add(floor);

  const h = 3;
  const t = 0.2;

  function wall(px,pz,rx){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,t), wallMat);
    m.position.set(px,1.5,pz);
    m.rotation.y = rx;
    scene.add(m);
    addCollider(m);
  }

  wall(x, z-d/2, 0);
  wall(x, z+d/2, 0);
  wall(x-w/2, z, Math.PI/2);
  wall(x+w/2, z, Math.PI/2);
}

/* ================= DOORWAY WITH CUTOUT ================= */
const doors = [];

function doorway(x,z){
  // side walls
  const sideL = new THREE.Mesh(new THREE.BoxGeometry(1,3,0.2), wallMat);
  sideL.position.set(x-1.5,1.5,z);
  scene.add(sideL); addCollider(sideL);

  const sideR = new THREE.Mesh(new THREE.BoxGeometry(1,3,0.2), wallMat);
  sideR.position.set(x+1.5,1.5,z);
  scene.add(sideR); addCollider(sideR);

  // top beam
  const top = new THREE.Mesh(new THREE.BoxGeometry(3,0.5,0.2), wallMat);
  top.position.set(x,3.25,z);
  scene.add(top); addCollider(top);

  // door
  const door = new THREE.Mesh(new THREE.BoxGeometry(3,3,0.15), doorMat);
  door.position.set(x-1.5,1.5,z);
  door.userData.open = false;
  door.geometry.translate(1.5,0,0);
  scene.add(door);
  doors.push(door);
}

/* ================= BUILD MAP ================= */
room(0,5,8,8);
room(0,-5,8,8);
doorway(0,0);

/* ================= DOOR INTERACTION ================= */
addEventListener("keydown", e=>{
  if(e.code!=="KeyE") return;
  const p = camera.position;
  doors.forEach(d=>{
    if(p.distanceTo(d.position)<2){
      d.userData.open = !d.userData.open;
    }
  });
});

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  velocity.set(0,0,0);
  const speed = 4;

  if(move.f) velocity.z -= speed*dt;
  if(move.b) velocity.z += speed*dt;
  if(move.l) velocity.x -= speed*dt;
  if(move.r) velocity.x += speed*dt;

  controls.moveRight(velocity.x);
  controls.moveForward(velocity.z);

  // door animation
  doors.forEach(d=>{
    const target = d.userData.open ? Math.PI/2 : 0;
    d.rotation.y += (target - d.rotation.y) * 0.1;
  });

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
