<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{display:block}
#ui{
  position:fixed;
  top:10px;
  left:10px;
  color:#aaa;
  font-family:monospace;
  z-index:10;
}
</style>
</head>
<body>

<div id="ui">WASD move · Mouse look · F flashlight</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2, 15, Math.PI/7, 0.5, 1);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);

/* ================= INPUT ================= */
const keys = {};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyF") flashlight.visible=!flashlight.visible;
});
addEventListener("keyup",e=>keys[e.code]=false);

let yaw=0, pitch=0;
addEventListener("mousemove",e=>{
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

/* ================= COLLISION SYSTEM ================= */
const colliders = [];

function addCollider(mesh){
  mesh.geometry.computeBoundingBox();
  colliders.push(mesh);
}

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1b1b1b });
function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.3), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
  addCollider(m);
}

wall(10,4,0,2,-5);
wall(10,4,-5,2,0,Math.PI/2);
wall(10,4,5,2,0,-Math.PI/2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12,12),
  new THREE.MeshStandardMaterial({ color:0x111111 })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= LOBBY SIMULATION ================= */
const lobbyGroup = new THREE.Group();
scene.add(lobbyGroup);

const fakePlayers = [];
for(let i=0;i<4;i++){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.3,1),
    new THREE.MeshStandardMaterial({ color:0x444444 })
  );
  p.position.set(Math.random()*4-2,1,Math.random()*4-2);
  lobbyGroup.add(p);
  fakePlayers.push(p);
}

let inLobby = true;
setTimeout(()=>{
  inLobby = false;
  lobbyGroup.visible = false;
}, 5000);

/* ================= CLOSET DRAGGER ================= */
const dragger = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.35,1.2),
  new THREE.MeshStandardMaterial({ color:0x552222 })
);
dragger.position.set(2,1,2);
scene.add(dragger);

/* ================= PSYCHO ROOM ================= */
const psychoZone = new THREE.Box3(
  new THREE.Vector3(-2,0,-2),
  new THREE.Vector3(2,3,2)
);

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();
const dir = new THREE.Vector3();
const raycaster = new THREE.Raycaster();

function canMove(nextPos){
  const box = new THREE.Box3(
    new THREE.Vector3(nextPos.x-0.3, nextPos.y-1.6, nextPos.z-0.3),
    new THREE.Vector3(nextPos.x+0.3, nextPos.y+0.3, nextPos.z+0.3)
  );
  return !colliders.some(c=>{
    const cb = new THREE.Box3().setFromObject(c);
    return box.intersectsBox(cb);
  });
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  /* lobby idle */
  if(inLobby){
    fakePlayers.forEach(p=>{
      p.position.x += Math.sin(performance.now()*0.001)*0.001;
    });
  }

  /* movement */
  dir.set(0,0,0);
  if(keys.KeyW) dir.z -= 1;
  if(keys.KeyS) dir.z += 1;
  if(keys.KeyA) dir.x -= 1;
  if(keys.KeyD) dir.x += 1;
  dir.normalize();

  velocity.copy(dir).applyEuler(camera.rotation).multiplyScalar(dt*3);
  const nextPos = camera.position.clone().add(velocity);
  if(canMove(nextPos)) camera.position.copy(nextPos);

  /* dragger proximity */
  if(camera.position.distanceTo(dragger.position) < 1.5){
    camera.position.lerp(new THREE.Vector3(0,1.6,4),0.1);
  }

  /* psycho room effect */
  if(psychoZone.containsPoint(camera.position)){
    floor.material.color.setHex(0x0f0f0f);
  } else {
    floor.material.color.setHex(0x111111);
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
