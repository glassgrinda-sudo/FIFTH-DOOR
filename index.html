<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas { display: block; }
#hint {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #aaa;
  font-family: Arial;
  font-size: 14px;
  background: rgba(0,0,0,0.6);
  padding: 6px 10px;
  border-radius: 4px;
}
</style>
</head>
<body>

<div id="hint">
WASD move | Mouse look | Shift sprint | F flashlight
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020202);
scene.fog = new THREE.Fog(0x020202, 2, 18);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.3));

const flashlight = new THREE.SpotLight(0xffffff, 2.2, 15, Math.PI / 6, 0.4, 1);
flashlight.visible = true;
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.target.position.set(0, 0, -1);

scene.add(camera);

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });
const ceilMat  = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 1 });

const colliders = [];

/* ================= ROOM BUILDER ================= */
function room(x, z, w = 6, d = 6) {
  const h = 3;

  function wall(px, py, pz, sx, sy, sz) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), wallMat);
    m.position.set(px, py, pz);
    scene.add(m);
    colliders.push(m);
  }

  function floor(px, pz) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(w, 0.1, d), floorMat);
    f.position.set(px, 0, pz);
    scene.add(f);
  }

  function ceil(px, pz) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(w, 0.1, d), ceilMat);
    c.position.set(px, h, pz);
    scene.add(c);
  }

  floor(x, z);
  ceil(x, z);

  wall(x, h/2, z - d/2, w, h, 0.2);
  wall(x, h/2, z + d/2, w, h, 0.2);
  wall(x - w/2, h/2, z, 0.2, h, d);
  wall(x + w/2, h/2, z, 0.2, h, d);
}

/* ================= MAP ================= */
room(0, 0);
room(8, 0);
room(-8, 0);
room(0, -8);

/* ================= CONTROLS ================= */
let yaw = 0;
let pitch = 0;
const keys = {};

addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

addEventListener("click", () => {
  document.body.requestPointerLock();
});

addEventListener("mousemove", e => {
  if (document.pointerLockElement !== document.body) return;

  yaw   -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;

  pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));

  camera.rotation.set(pitch, yaw, 0);
});

/* ================= FLASHLIGHT ================= */
let flashlightOn = true;
addEventListener("keydown", e => {
  if (e.code === "KeyF") {
    flashlightOn = !flashlightOn;
    flashlight.visible = flashlightOn;
  }
});

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();
const dir = new THREE.Vector3();
const ray = new THREE.Raycaster();

function blocked(pos) {
  for (const c of colliders) {
    ray.set(pos, new THREE.Vector3(0, -1, 0));
    if (ray.intersectObject(c).length) return true;
  }
  return false;
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  velocity.set(0, 0, 0);

  const speed = keys["ShiftLeft"] ? 4 : 2;

  if (keys["KeyW"]) velocity.z -= speed * dt;
  if (keys["KeyS"]) velocity.z += speed * dt;
  if (keys["KeyA"]) velocity.x -= speed * dt;
  if (keys["KeyD"]) velocity.x += speed * dt;

  dir.copy(velocity).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  const next = camera.position.clone().add(dir);

  // simple collision
  let blockedMove = false;
  for (const c of colliders) {
    const box = new THREE.Box3().setFromObject(c);
    if (box.containsPoint(next)) {
      blockedMove = true;
      break;
    }
  }

  if (!blockedMove) camera.position.copy(next);

  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
