<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, sans-serif;
}
canvas { display:block; }

#hud {
  position:fixed;
  top:14px;
  left:14px;
  color:#ddd;
  font-size:14px;
  z-index:5;
}
#overlay {
  position:fixed;
  inset:0;
  background:#000;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}
.hidden { display:none; }
</style>
</head>

<body>

<div id="hud">
  <b>FIFTH DOOR</b><br>
  WASD Move · Mouse Look · F Flashlight · Shift Sprint · Esc Menu
</div>

<div id="overlay">
  <div>CLICK TO ENTER</div>
  <small>You should not be alone.</small>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 18);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0,1.6,5);

/* ================= PLAYER ================= */
const player = new THREE.Object3D();
player.position.copy(camera.position);
scene.add(player);
player.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI/7, 0.4);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
let flashlightOn = true;

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1b1b1b });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111 });

function wall(w,h,x,y,z,r=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = r;
  scene.add(m);
}
function floor(w,d,x,z){
  const f = new THREE.Mesh(new THREE.PlaneGeometry(w,d), floorMat);
  f.rotation.x = -Math.PI/2;
  f.position.set(x,0,z);
  scene.add(f);
}

/* Room */
floor(10,10,0,0);
wall(10,4,0,2,-5);
wall(10,4,0,2,5,Math.PI);
wall(10,4,-5,2,0,Math.PI/2);
wall(10,4,5,2,0,-Math.PI/2);

/* Hallway */
floor(4,12,0,-11);
wall(4,4,0,2,-17);
wall(12,4,-2,2,-11,Math.PI/2);
wall(12,4,2,2,-11,-Math.PI/2);

/* ================= CONTROLS ================= */
let locked = false;
const keys = {};

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

canvas.addEventListener("click",()=>{
  canvas.requestPointerLock();
});

addEventListener("pointerlockchange",()=>{
  locked = document.pointerLockElement === canvas;
  overlay.classList.toggle("hidden", locked);
});

/* Mouse look */
let pitch = 0;
addEventListener("mousemove",e=>{
  if(!locked) return;
  player.rotation.y -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  camera.rotation.x = pitch;
});

/* Flashlight */
addEventListener("keydown",e=>{
  if(e.code==="KeyF"){
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 2 : 0;
  }
});

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
let yVel = 0;
const gravity = 20;

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if(locked){
    direction.set(
      (keys["KeyD"]?1:0) - (keys["KeyA"]?1:0),
      0,
      (keys["KeyW"]?1:0) - (keys["KeyS"]?1:0)
    ).normalize();

    const speed = keys["ShiftLeft"] ? 6 : 3;

    velocity.x = direction.x * speed * dt;
    velocity.z = direction.z * speed * dt;

    player.translateX(velocity.x);
    player.translateZ(velocity.z);

    yVel -= gravity * dt;
    player.position.y += yVel * dt;

    if(player.position.y < 1.6){
      player.position.y = 1.6;
      yVel = 0;
      if(keys["Space"]) yVel = 6;
    }
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
