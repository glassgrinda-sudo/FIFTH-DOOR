<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: monospace;
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #ddd;
    z-index: 10;
    font-size: 14px;
  }
</style>
</head>

<body>
<div id="ui">
  <b>FIFTH DOOR</b><br>
  WASD move · Mouse look · F flashlight · E open door
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155/examples/js/controls/PointerLockControls.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020202);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ================= CONTROLS ================= */
const controls = new THREE.PointerLockControls(camera, document.body);
document.body.addEventListener("click", () => controls.lock());

scene.add(controls.getObject());

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI / 6, 0.4);
flashlight.visible = true;
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);

/* ================= INPUT ================= */
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyF") flashlight.visible = !flashlight.visible;
});
addEventListener("keyup", e => keys[e.code] = false);

/* ================= COLLISION ================= */
const colliders = [];

function solid(mesh) {
  mesh.userData.solid = true;
  colliders.push(mesh);
}

/* ================= ROOM BUILDER ================= */
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

function room(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), floorMat);
  floor.rotation.x = -Math.PI / 2;
  g.add(floor);

  const walls = [
    [0, 1.5, -3, 0],
    [0, 1.5, 3, Math.PI],
    [-3, 1.5, 0, Math.PI / 2],
    [3, 1.5, 0, -Math.PI / 2]
  ];

  walls.forEach(w => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), wallMat);
    m.position.set(w[0], w[1], w[2]);
    m.rotation.y = w[3];
    solid(m);
    g.add(m);
  });

  scene.add(g);
}

room(0, 0);
room(0, -6);

/* ================= DOOR ================= */
let doorOpen = false;

const doorPivot = new THREE.Object3D();
doorPivot.position.set(0, 1.5, -3); // doorway position
scene.add(doorPivot);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(1, 2.8, 0.15),
  new THREE.MeshStandardMaterial({ color: 0x4a0e0e })
);
door.position.set(0.5, 0, 0); // hinge offset
doorPivot.add(door);
solid(door);

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();
const dir = new THREE.Vector3();

function move(dt) {
  dir.set(0, 0, 0);
  if (keys.KeyW) dir.z -= 1;
  if (keys.KeyS) dir.z += 1;
  if (keys.KeyA) dir.x -= 1;
  if (keys.KeyD) dir.x += 1;
  dir.normalize();

  velocity.copy(dir).multiplyScalar(3 * dt);
  controls.moveRight(velocity.x);
  controls.moveForward(velocity.z);
}

/* ================= DOOR INTERACTION ================= */
addEventListener("keydown", e => {
  if (e.code === "KeyE") {
    const dist = camera.position.distanceTo(doorPivot.position);
    if (dist < 2) doorOpen = !doorOpen;
  }
});

/* ================= UPDATE ================= */
function update(dt) {
  if (doorOpen) {
    doorPivot.rotation.y = THREE.MathUtils.lerp(doorPivot.rotation.y, -Math.PI / 2, 0.1);
  } else {
    doorPivot.rotation.y = THREE.MathUtils.lerp(doorPivot.rotation.y, 0, 0.1);
  }
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  move(dt);
  update(dt);
  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
