<title>FIFTH DOOR</title>

<style>
html,body{

}
canvas{display:block;width:100%;height:100%;}

#ui{

  border-radius:4px;
  z-index:10;
}

#overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#aaa;
  font-size:20px;
  z-index:20;
  cursor:pointer;
}
#overlay.fade{opacity:0;pointer-events:none;}
#overlay small{margin-top:10px;font-size:14px;opacity:.6;}
</style>
</head>

<small>You only cross once.</small>
</div>

);

scene.add(door);

  camera.add(h);
  handMixer=new THREE.AnimationMixer(h);
  g.animations.forEach(a=>handMixer.clipAction(a).play());
});
