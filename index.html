<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body { margin:0; padding:0; overflow:hidden; background:#000; }
canvas { display:block; }
#ui {
  position:fixed;
  top:12px; left:12px;
  color:#ddd;
  font-family:monospace;
  font-size:14px;
  z-index:10;
}
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · Shift sprint · E door · Esc unlock
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ===================== BASIC SETUP ===================== */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 30);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,0);

/* ===================== LIGHTING ===================== */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI/6, 0.4);
flashlight.visible = false;
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ===================== MATERIALS ===================== */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111 });
const doorMat = new THREE.MeshStandardMaterial({ color:0x552222 });

/* ===================== COLLISION ===================== */
const colliders = [];
function addCollider(mesh){ colliders.push(mesh); }

/* ===================== ROOM BUILDER ===================== */
function room(x,z){
  const g = new THREE.Group();

  const floor = new THREE.Mesh(new THREE.BoxGeometry(6,0.2,6), floorMat);
  floor.position.y = 0;
  g.add(floor);

  const ceiling = floor.clone();
  ceiling.position.y = 3;
  g.add(ceiling);

  function wall(px,pz,rx=0){
    const w = new THREE.Mesh(new THREE.BoxGeometry(6,3,0.2), wallMat);
    w.position.set(px,1.5,pz);
    w.rotation.y = rx;
    g.add(w);
    addCollider(w);
  }

  wall(0,-3);
  wall(0,3);
  wall(-3,0,Math.PI/2);
  wall(3,0,Math.PI/2);

  g.position.set(x,0,z);
  scene.add(g);
}

function corridor(x,z,dir){
  const c = new THREE.Mesh(new THREE.BoxGeometry(2,3,6), wallMat);
  c.position.set(x,1.5,z);
  if(dir==="x") c.rotation.y = Math.PI/2;
  scene.add(c);
  addCollider(c);
}

/* ===================== DOOR ===================== */
const doors = [];
function door(x,z){
  const d = new THREE.Mesh(new THREE.BoxGeometry(1,2.5,0.2), doorMat);
  d.position.set(x,1.25,z);
  d.userData = { open:false, angle:0 };
  scene.add(d);
  addCollider(d);
  doors.push(d);
}

/* ===================== MAP ===================== */
room(0,0);
room(0,-10);
corridor(0,-5);
door(0,-3);

/* ===================== INPUT ===================== */
let keys = {};
let pitch=0, yaw=0;
let locked=false;

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

canvas.addEventListener("click",()=>{
  canvas.requestPointerLock();
});

document.addEventListener("pointerlockchange",()=>{
  locked = document.pointerLockElement === canvas;
});

addEventListener("mousemove",e=>{
  if(!locked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
});

/* ===================== MOVEMENT ===================== */
function collide(pos){
  for(const c of colliders){
    const b = new THREE.Box3().setFromObject(c);
    if(b.containsPoint(pos)) return true;
  }
  return false;
}

/* ===================== LOOP ===================== */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  camera.rotation.set(pitch, yaw, 0);

  let speed = keys.ShiftLeft ? 4 : 2;
  let dir = new THREE.Vector3();

  if(keys.KeyW) dir.z -= 1;
  if(keys.KeyS) dir.z += 1;
  if(keys.KeyA) dir.x -= 1;
  if(keys.KeyD) dir.x += 1;

  dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  const next = camera.position.clone().add(dir.multiplyScalar(speed*dt));
  if(!collide(next)) camera.position.copy(next);

  if(keys.KeyF){
    flashlight.visible = !flashlight.visible;
    keys.KeyF = false;
  }

  if(keys.KeyE){
    for(const d of doors){
      if(camera.position.distanceTo(d.position)<2){
        d.userData.open = !d.userData.open;
      }
    }
    keys.KeyE=false;
  }

  for(const d of doors){
    const target = d.userData.open ? Math.PI/2 : 0;
    d.userData.angle += (target - d.userData.angle)*0.1;
    d.rotation.y = d.userData.angle;
  }

  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
