<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
canvas { display:block; }
#ui {
  position:fixed;
  top:12px; left:12px;
  color:#ddd;
  font-family:Arial, sans-serif;
  font-size:14px;
  z-index:10;
}
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · Shift sprint · E open door
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.08);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.25));

const flashlight = new THREE.SpotLight(0xffffff, 3.2, 18, Math.PI/7, 0.35, 1.2);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:1 });
const doorMat = new THREE.MeshStandardMaterial({ color:0x4a0e0e, roughness:0.6 });

/* ================= COLLISION ================= */
const colliders = [];

/* ================= ROOM BUILDER ================= */
function buildRoom(x,z,w,d,doorSides=[]) {
  const h = 3;

  // Floor
  const floor = new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d), floorMat);
  floor.position.set(x,0,z);
  scene.add(floor);
  colliders.push(floor);

  // Ceiling
  const ceil = new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d), wallMat);
  ceil.position.set(x,h,z);
  scene.add(ceil);

  // Walls
  const walls = [
    { dx:0, dz:-d/2, rw:w, rd:0.1, rot:0 },        // north
    { dx:0, dz:d/2, rw:w, rd:0.1, rot:0 },         // south
    { dx:-w/2, dz:0, rw:0.1, rd:d, rot:0 },        // west
    { dx:w/2, dz:0, rw:0.1, rd:d, rot:0 }          // east
  ];

  walls.forEach((wdata,i)=>{
    if (doorSides.includes(i)) return;

    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(wdata.rw, h, wdata.rd),
      wallMat
    );
    wall.position.set(x+wdata.dx, h/2, z+wdata.dz);
    scene.add(wall);
    colliders.push(wall);
  });
}

/* ================= DOOR ================= */
const doors = [];

function buildDoor(x,z,side) {
  const hinge = new THREE.Object3D();
  hinge.position.set(x,1.5,z);

  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1,3,0.15),
    doorMat
  );

  door.position.set(side === "east" ? -0.5 : 0.5,0,0);
  hinge.add(door);
  scene.add(hinge);

  doors.push({ hinge, open:false });

  // Collider
  colliders.push(door);
}

/* ================= MAP ================= */
// Central room
buildRoom(0,0,6,6,[1]);
buildDoor(0,3.05,"south");

// Corridor
buildRoom(0,8,3,6,[0,1]);

// Back room
buildRoom(0,14,6,6,[0]);

/* ================= CONTROLS ================= */
let keys = {};
let yaw = 0, pitch = 0;
let flashlightOn = true;

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyF"){
    flashlightOn = !flashlightOn;
    flashlight.visible = flashlightOn;
  }
  if(e.code==="KeyE"){
    doors.forEach(d=>{
      d.open = !d.open;
      d.hinge.rotation.y = d.open ? Math.PI/2 : 0;
    });
  }
});
addEventListener("keyup",e=>keys[e.code]=false);

renderer.domElement.addEventListener("click",()=>{
  renderer.domElement.requestPointerLock();
});

addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==renderer.domElement) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1,pitch));
});

/* ================= MOVEMENT ================= */
function intersects(pos){
  const box = new THREE.Box3(
    new THREE.Vector3(pos.x-0.25,pos.y-1.6,pos.z-0.25),
    new THREE.Vector3(pos.x+0.25,pos.y,pos.z+0.25)
  );
  return colliders.some(c=>box.intersectsBox(new THREE.Box3().setFromObject(c)));
}

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);

  camera.rotation.order="YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const speed = (keys["ShiftLeft"]?0.12:0.06);
  const dir = new THREE.Vector3();

  if(keys["KeyW"]) dir.z -= speed;
  if(keys["KeyS"]) dir.z += speed;
  if(keys["KeyA"]) dir.x -= speed;
  if(keys["KeyD"]) dir.x += speed;

  dir.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  const next = camera.position.clone().add(dir);
  if(!intersects(next)) camera.position.copy(next);

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
