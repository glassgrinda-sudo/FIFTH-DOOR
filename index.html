scene.add(overhead);

===================== */

  new THREE.MeshStandardMaterial({
    color: 0x222222,
    side: THREE.BackSide
  })
);
hallway.position.z = 2;
scene.add(hallway);

   DOOR
===================== */

scene.add(doorGroup);

);

doorGroup.add(door);

doorGroup.position.z = 1;
doorGroup.position.y = 0;
