<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{
  margin:0;height:100%;overflow:hidden;background:#000;
  font-family:Arial,sans-serif;
}
canvas{display:block}

#ui{
  position:absolute;top:20px;left:20px;
  color:#ccc;background:rgba(0,0,0,0.65);
  padding:12px 16px;border-radius:6px;
  z-index:10
}

#overlay{
  position:fixed;inset:0;background:#000;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;color:#aaa;
  font-size:20px;letter-spacing:1px;
  z-index:20;transition:opacity 1.2s ease;
}
#overlay.fade{opacity:0;pointer-events:none}
#overlay small{margin-top:12px;font-size:14px;opacity:.6}
</style>
</head>
<body>

<div id="ui">
  <b>FIFTH DOOR</b><br>
  <span id="status">Waiting…</span>
</div>

<div id="overlay">
  <div>PRESS SPACE TO ENTER</div>
  <small>Some doors only open when you choose to step through.</small>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const statusEl = document.getElementById("status");

const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x050505,1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505,0.06);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,50);
camera.position.set(0,1.65,8); // START BACK
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222,0.4));

const mainLight = new THREE.PointLight(0xfff2cc,0.6,20);
mainLight.position.set(0,3,0);
scene.add(mainLight);

/* ================= HALLWAY ================= */
const wallMat = new THREE.MeshStandardMaterial({
  color:0x1c1c1c,roughness:.95
});

const hallway = new THREE.Mesh(
  new THREE.BoxGeometry(4,4,12),
  wallMat
);
hallway.position.z = -2;
scene.add(hallway);

/* ================= FLOOR ================= */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4,12),
  new THREE.MeshStandardMaterial({color:0x141414,roughness:.9})
);
floor.rotation.x = -Math.PI/2;
floor.position.set(0,0,-2);
scene.add(floor);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(2,3.5,0.25),
  new THREE.MeshStandardMaterial({color:0x4a0e0e,roughness:.7})
);
door.position.set(0,1.75,-6);
scene.add(door);

/* ================= HAND ================= */
const hand = new THREE.Mesh(
  new THREE.BoxGeometry(.2,.3,.5),
  new THREE.MeshStandardMaterial({color:0x7a5a4a})
);
hand.position.set(.4,-.4,-1);
camera.add(hand);

/* ================= STATE ================= */
let started=false;
let enterTime=0;

/* ================= ENTER ================= */
function enterGame(){
  if(started) return;
  started=true;

  statusEl.textContent="Connected";
  overlay.classList.add("fade");

  document.documentElement.requestFullscreen?.();
  canvas.requestPointerLock?.();

  enterTime=performance.now();
}

/* ================= INPUT ================= */
addEventListener("keydown",e=>{
  if(e.code==="Space") enterGame();
});

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);

  if(started){
    const t=(performance.now()-enterTime)/1000;

    // CAMERA PUSH INTO HALLWAY
    camera.position.z = THREE.MathUtils.lerp(8,3,Math.min(t/2,1));

    // LIGHT RAMP
    mainLight.intensity = THREE.MathUtils.lerp(0.6,1.4,Math.min(t/2,1));

    // BREATHING HAND
    hand.position.y = -0.4 + Math.sin(t*1.5)*0.02;
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
