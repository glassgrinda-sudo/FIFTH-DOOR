<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
canvas { display: block; width: 100%; height: 100%; }

#ui {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #ccc;
  background: rgba(0,0,0,0.6);
  padding: 10px 14px;
  border-radius: 4px;
  z-index: 10;
}

#overlay {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #aaa;
  font-size: 20px;
  z-index: 20;
  transition: opacity 1s ease;
}
#overlay.fade { opacity: 0; pointer-events: none; }
#overlay small { margin-top: 10px; font-size: 14px; opacity: 0.6; }
</style>
</head>

<body>

<div id="ui">
  <b>FIFTH DOOR</b><br>
  <span id="status">Waiting…</span>
</div>

<div id="overlay">
  <div>PRESS SPACE TO ENTER</div>
  <small>Some doors only open when you choose.</small>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const statusEl = document.getElementById("status");

/* ================= RENDERER ================= */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505, 1);

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 3, 20);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1.6, 8);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.6));
const keyLight = new THREE.PointLight(0xfff2cc, 1.2, 20);
keyLight.position.set(0, 3, 2);
scene.add(keyLight);

/* ================= ENV ================= */
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.95 });

function wall(w, h, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  scene.add(m);
}
wall(12, 4, -2, 2, -2,  Math.PI / 2);
wall(12, 4,  2, 2, -2, -Math.PI / 2);
wall(4,  4,  0, 2, -8);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 12),
  new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, -2);
scene.add(floor);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(2, 3.5, 0.25),
  new THREE.MeshStandardMaterial({ color: 0x4a0e0e, roughness: 0.7 })
);
door.position.set(0, 1.75, -6);
scene.add(door);

/* ================= HAND (IMPROVED) ================= */
const skin = new THREE.MeshStandardMaterial({
  color: 0x7b5a45,
  roughness: 0.6,
  metalness: 0.05
});

const hand = new THREE.Group();

const palm = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.18, 0.25, 6, 12),
  skin
);
palm.rotation.z = Math.PI / 2;
hand.add(palm);

for (let i = 0; i < 4; i++) {
  const finger = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.04, 0.18, 4, 8),
    skin
  );
  finger.position.set(0.05, 0.1 - i * 0.05, 0.12);
  finger.rotation.x = -0.4;
  hand.add(finger);
}

const thumb = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.05, 0.14, 4, 8),
  skin
);
thumb.position.set(-0.02, 0.05, 0.12);
thumb.rotation.z = 0.6;
thumb.rotation.x = -0.6;
hand.add(thumb);

hand.position.set(0.4, -0.4, -1);
camera.add(hand);

/* ================= AUDIO ================= */
const listener = new THREE.AudioListener();
camera.add(listener);

const lobbyAmb = new THREE.Audio(listener);
const gameAmb  = new THREE.Audio(listener);
const enterSnd = new THREE.Audio(listener);

const audioLoader = new THREE.AudioLoader();

audioLoader.load("lobby.mp3", b => {
  lobbyAmb.setBuffer(b);
  lobbyAmb.setLoop(true);
  lobbyAmb.setVolume(0.4);
  lobbyAmb.play();
});

audioLoader.load("game.mp3", b => {
  gameAmb.setBuffer(b);
  gameAmb.setLoop(true);
  gameAmb.setVolume(0.5);
});

audioLoader.load("enter.mp3", b => {
  enterSnd.setBuffer(b);
  enterSnd.setVolume(0.7);
});

/* ================= STATE ================= */
let started = false;
let enterTime = 0;

/* ================= ENTER ================= */
function enterGame() {
  if (started) return;
  started = true;

  statusEl.textContent = "Connected";
  overlay.classList.add("fade");
  enterTime = performance.now();

  enterSnd.play();
  lobbyAmb.stop();
  gameAmb.play();
}

/* ================= INPUT ================= */
addEventListener("keydown", e => {
  if (e.code === "Space") enterGame();
});

/* ================= LOOP ================= */
function animate() {
  requestAnimationFrame(animate);

  if (started) {
    const t = (performance.now() - enterTime) / 1000;
    camera.position.z = THREE.MathUtils.lerp(8, 3, Math.min(t / 2, 1));
    hand.position.y = -0.4 + Math.sin(t * 1.5) * 0.02;
    hand.rotation.y = Math.sin(t * 0.5) * 0.05;
  }

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
