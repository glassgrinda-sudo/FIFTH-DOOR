<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial;
}
#ui{
  position:absolute;
  top:20px;
  left:20px;
  z-index:10;
  color:#ddd;
  background:rgba(0,0,0,0.6);
  padding:10px 14px;
  border-radius:6px;
}
canvas{display:block}
</style>
</head>
<body>

<div id="ui">
  <strong>FIFTH DOOR</strong><br>
  <span id="status">Connecting…</span>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
/* ================= SAFE RENDERER ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  powerPreference:"high-performance",
  preserveDrawingBuffer:true
});
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.setClearColor(0x050505, 1);

/* ================= SCENE & CAMERA ================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 5);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const keyLight = new THREE.PointLight(0xffffff, 1.4, 40);
keyLight.position.set(0, 3, 2);
scene.add(keyLight);

/* ================= HALLWAY (IN FRONT OF CAMERA) ================= */
const hallway = new THREE.Mesh(
  new THREE.BoxGeometry(4,4,10),
  new THREE.MeshStandardMaterial({ color:0x222222 })
);
hallway.position.z = -4;
scene.add(hallway);

/* ================= FLOOR ================= */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4,10),
  new THREE.MeshStandardMaterial({ color:0x2a2a2a })
);
floor.rotation.x = -Math.PI/2;
floor.position.set(0,0,-4);
scene.add(floor);

/* ================= DOOR ================= */
const doorGroup = new THREE.Group();
scene.add(doorGroup);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(2,3.5,0.25),
  new THREE.MeshStandardMaterial({ color:0x550000 })
);
door.position.set(0,1.75,-3.5);
doorGroup.add(door);

/* ================= BLOOD DRIPS ================= */
const bloodDrops = [];
const bloodMat = new THREE.MeshStandardMaterial({ color:0x880000 });

for(let i=0;i<25;i++){
  const d = new THREE.Mesh(
    new THREE.SphereGeometry(0.035,8,8),
    bloodMat
  );
  d.position.set(
    (Math.random()-0.5)*1.6,
    3.6 + Math.random(),
    -3.4
  );
  d.userData.speed = 0.004 + Math.random()*0.008;
  bloodDrops.push(d);
  scene.add(d);
}

/* ================= BLOOD POOL ================= */
const bloodPool = new THREE.Mesh(
  new THREE.CircleGeometry(0.15,32),
  new THREE.MeshStandardMaterial({ color:0x660000 })
);
bloodPool.rotation.x = -Math.PI/2;
bloodPool.position.set(0,0.02,-3.1);
scene.add(bloodPool);

/* ================= NETWORK ================= */
const statusEl = document.getElementById("status");
let doorOpening = false;

const socket = new WebSocket("wss://fifth-door-server.onrender.com");
socket.onopen = () => statusEl.textContent = "The door is sealed…";
socket.onmessage = e => {
  const data = JSON.parse(e.data);
  if(data.type === "init"){
    statusEl.textContent = "Enter.";
    doorOpening = true;
  }
};

/* ================= ANIMATION ================= */
let doorAngle = 0;

function animate(){
  requestAnimationFrame(animate);

  // blood drips
  bloodDrops.forEach(d=>{
    d.position.y -= d.userData.speed;
    if(d.position.y < 0.05) d.position.y = 3.6;
  });

  // pool grows
  bloodPool.scale.x += 0.0006;
  bloodPool.scale.y += 0.0006;

  // door opens
  if(doorOpening && doorAngle > -Math.PI/2){
    doorAngle -= 0.01;
    doorGroup.rotation.y = doorAngle;
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
});
</script>
</body>
</html>
