<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#ui{
 position:absolute;top:20px;left:20px;color:#ccc;
 background:rgba(0,0,0,0.6);padding:12px;border-radius:6px;
 font-family:Arial;z-index:10
}
canvas{display:block}
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
<span id="status">Waiting…</span>
</div>

<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* RENDERER */
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505,1);

/* SCENE */
const scene=new THREE.Scene();

/* CAMERA */
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,50);
camera.position.set(0,1.65,5);
scene.add(camera);

/* FOG */
scene.fog=new THREE.FogExp2(0x050505,0.08);

/* LIGHTING */
const ambient=new THREE.AmbientLight(0x222222,0.4);
scene.add(ambient);

const flickerLight=new THREE.PointLight(0xfff2cc,1.4,18);
flickerLight.position.set(0,3,2);
scene.add(flickerLight);

/* ENVIRONMENT */
const wallMat=new THREE.MeshStandardMaterial({
 color:0x1c1c1c, roughness:0.95, metalness:0.05
});

const hallway=new THREE.Mesh(
 new THREE.BoxGeometry(4,4,12),
 wallMat
);
hallway.position.z=-4;
scene.add(hallway);

/* FLOOR */
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(4,12),
 new THREE.MeshStandardMaterial({color:0x151515,roughness:0.85})
);
floor.rotation.x=-Math.PI/2;
floor.position.set(0,0,-4);
scene.add(floor);

/* HANDS */
const hand=new THREE.Mesh(
 new THREE.BoxGeometry(0.2,0.3,0.5),
 new THREE.MeshStandardMaterial({color:0x7a5a4a,roughness:0.8})
);
hand.position.set(0.4,-0.4,-1);
camera.add(hand);

/* FLASHLIGHT */
const beam=new THREE.SpotLight(0xffffff,2,10,0.6,0.7);
beam.position.set(0.4,-0.4,-1);
beam.target.position.set(0,0,-5);
camera.add(beam);
camera.add(beam.target);

/* AI IMPOSTOR */
const impostor=new THREE.Mesh(
 new THREE.CapsuleGeometry(0.35,1.4,6,12),
 new THREE.MeshStandardMaterial({color:0x333333})
);
impostor.position.set(0,0,-6);
scene.add(impostor);

/* BLOOD DRIP */
const drops=[];
for(let i=0;i<20;i++){
 const d=new THREE.Mesh(
  new THREE.SphereGeometry(0.03,8,8),
  new THREE.MeshStandardMaterial({color:0x770000})
 );
 d.position.set((Math.random()-0.5)*1.6,3+Math.random(),-4);
 d.userData.spd=0.003+Math.random()*0.005;
 drops.push(d);scene.add(d);
}

/* STATE */
let danger=0;
let t=0;

function animate(){
 requestAnimationFrame(animate);
 t+=0.01;

 /* light flicker */
 flickerLight.intensity=1.2+Math.sin(t*8)*0.3;

 /* dust illusion */
 scene.fog.density=0.07+Math.sin(t*2)*0.01;

 /* hand breathing */
 hand.position.y=-0.4+Math.sin(t*1.5)*0.02;

 /* impostor uncanny motion */
 impostor.position.x=Math.sin(t*0.4)*0.4;
 impostor.rotation.y=Math.sin(t*0.2)*0.3;

 /* blood */
 drops.forEach(d=>{
  d.position.y-=d.userData.spd;
  if(d.position.y<0.05)d.position.y=3;
 });

 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
