<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>

<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:monospace;
}
canvas { display:block; }

#ui {
  position:fixed;
  top:14px;
  left:14px;
  color:#ddd;
  font-size:13px;
  z-index:10;
}
#hint {
  position:fixed;
  bottom:14px;
  width:100%;
  text-align:center;
  color:#888;
  font-size:12px;
}
</style>
</head>

<body>

<div id="ui">
  <b>FIFTH DOOR</b><br>
  WASD move · Mouse look · F flashlight · Shift sprint · Esc unlock
</div>
<div id="hint">Click to lock mouse</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.08);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.4));

const flashlight = new THREE.SpotLight(
  0xffffff,
  2.2,
  18,
  Math.PI/6,
  0.4,
  1
);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.visible = false;

/* ================= WORLD ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:1 });

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

wall(12,4, 0,2,-6);
wall(12,4,-6,2, 0, Math.PI/2);
wall(12,4, 6,2, 0,-Math.PI/2);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= INPUT ================= */
let locked = false;
let pitch = 0;
let yaw = 0;

const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("click", () => {
  canvas.requestPointerLock();
});

addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === canvas;
  document.getElementById("hint").style.display = locked ? "none" : "block";
});

addEventListener("mousemove", e => {
  if (!locked) return;

  const sensitivity = 0.002;
  yaw   -= e.movementX * sensitivity;
  pitch -= e.movementY * sensitivity;

  pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));

  camera.rotation.set(pitch, yaw, 0);
});

addEventListener("keydown", e => {
  if (e.code === "KeyF") {
    flashlight.visible = !flashlight.visible;
  }
  if (e.code === "Escape") {
    document.exitPointerLock();
  }
});

/* ================= MOVEMENT ================= */
const velocity = new THREE.Vector3();

function updateMovement(dt){
  const speed = keys["ShiftLeft"] ? 5 : 2.5;

  velocity.set(0,0,0);

  if (keys["KeyW"]) velocity.z -= 1;
  if (keys["KeyS"]) velocity.z += 1;
  if (keys["KeyA"]) velocity.x -= 1;
  if (keys["KeyD"]) velocity.x += 1;

  velocity.normalize().multiplyScalar(speed * dt);
  velocity.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  camera.position.add(velocity);
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (locked) updateMovement(dt);
  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
