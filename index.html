<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  font-family:monospace;
}
#ui {
  position:fixed;
  top:10px;
  left:10px;
  color:#fff;
  font-size:14px;
  z-index:10;
}
#hint {
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  color:#aaa;
  font-size:12px;
}
canvas { display:block; }
</style>
</head>

<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · E door · Shift sprint · Esc unlock
</div>
<div id="hint">Click to lock mouse</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 3, 25);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x404040,0.3));

const flashlight = new THREE.SpotLight(0xffffff, 2, 15, Math.PI/6, 0.5);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= INPUT ================= */
let locked = false;
let pitch = 0;
let yaw = 0;

document.body.addEventListener("click", ()=>{
  renderer.domElement.requestPointerLock();
});

document.addEventListener("pointerlockchange", ()=>{
  locked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener("mousemove", e=>{
  if(!locked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

/* ================= MOVEMENT ================= */
const keys = {};
document.addEventListener("keydown", e=>keys[e.code]=true);
document.addEventListener("keyup", e=>keys[e.code]=false);

const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
const speed = 3;

/* ================= COLLISION ================= */
const colliders = [];
const raycaster = new THREE.Raycaster();

/* ================= WORLD ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x222222 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111 });

function wall(w,h,d,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
  m.position.set(x,y,z);
  scene.add(m);
  colliders.push(m);
}

function floor(w,d,x,z){
  const f = new THREE.Mesh(new THREE.PlaneGeometry(w,d), floorMat);
  f.rotation.x = -Math.PI/2;
  f.position.set(x,0,z);
  scene.add(f);
}

/* ================= ROOMS ================= */
// Room 1
floor(6,6,0,0);
wall(6,3,0.2,0,1.5,-3);
wall(6,3,0.2,0,1.5,3);
wall(0.2,3,6,-3,1.5,0);
wall(0.2,3,6,3,1.5,0);

// Corridor
floor(2,4,0,-5);
wall(2,3,0.2,0,1.5,-7);
wall(0.2,3,4,-1,1.5,-5);
wall(0.2,3,4,1,1.5,-5);

// Room 2
floor(6,6,0,-10);
wall(6,3,0.2,0,1.5,-13);
wall(6,3,0.2,0,1.5,-7);
wall(0.2,3,6,-3,1.5,-10);
wall(0.2,3,6,3,1.5,-10);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(1,2,0.2),
  new THREE.MeshStandardMaterial({ color:0x552222 })
);
door.position.set(0,1,-7);
scene.add(door);

let doorOpen = false;

document.addEventListener("keydown", e=>{
  if(e.code==="KeyE"){
    const dist = camera.position.distanceTo(door.position);
    if(dist < 2){
      doorOpen = !doorOpen;
    }
  }
});

/* ================= FLASHLIGHT ================= */
let lightOn = true;
document.addEventListener("keydown", e=>{
  if(e.code==="KeyF"){
    lightOn = !lightOn;
    flashlight.intensity = lightOn ? 2 : 0;
  }
});

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  direction.set(0,0,0);
  if(keys["KeyW"]) direction.z -= 1;
  if(keys["KeyS"]) direction.z += 1;
  if(keys["KeyA"]) direction.x -= 1;
  if(keys["KeyD"]) direction.x += 1;
  direction.normalize();

  const moveSpeed = (keys["ShiftLeft"]?5:3) * dt;

  velocity.copy(direction).applyEuler(camera.rotation).multiplyScalar(moveSpeed);

  // Collision check
  raycaster.set(camera.position, velocity.clone().normalize());
  raycaster.far = velocity.length()+0.1;
  const hits = raycaster.intersectObjects(colliders);
  if(hits.length===0){
    camera.position.add(velocity);
  }

  // Door animation
  door.rotation.y += (doorOpen ? -1 : 1) * dt;
  door.rotation.y = THREE.MathUtils.clamp(door.rotation.y, -Math.PI/2, 0);

  renderer.render(scene,camera);
}

animate();

/* ================= RESIZE ================= */
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
