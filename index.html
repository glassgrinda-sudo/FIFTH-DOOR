<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const statusEl = document.getElementById("status");

/* ================= RENDERER ================= */
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505,1);
renderer.physicallyCorrectLights = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 4, 26);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,60);
camera.position.set(0,1.7,9);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x1a1a1a,0.25));

const ceilingLight = new THREE.PointLight(0xfff0d8, 18, 18, 2);
ceilingLight.position.set(0,3.4,-1);
ceilingLight.castShadow = true;
scene.add(ceilingLight);

const doorLight = new THREE.SpotLight(0xffd2aa, 35, 30, Math.PI/7, 0.5);
doorLight.position.set(0,3,-3);
doorLight.target.position.set(0,1.6,-7);
doorLight.castShadow = true;
scene.add(doorLight);
scene.add(doorLight.target);

/* ================= FLASHLIGHT ================= */
const flashlight = new THREE.SpotLight(0xffffff, 6, 10, Math.PI/9, 0.9);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({
  color:0x202020,
  roughness:0.95
});
const floorMat = new THREE.MeshStandardMaterial({
  color:0x141414,
  roughness:0.9
});
const doorMat = new THREE.MeshStandardMaterial({
  color:0x5a1414,
  roughness:0.65,
  metalness:0.15
});

/* ================= GEOMETRY ================= */
const hallway = new THREE.Mesh(
  new THREE.BoxGeometry(4.2,4,14),
  wallMat
);
hallway.position.z = -3;
hallway.receiveShadow = true;
scene.add(hallway);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4.2,14),
  floorMat
);
floor.rotation.x = -Math.PI/2;
floor.position.set(0,0,-3);
floor.receiveShadow = true;
scene.add(floor);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(2,3.6,0.3),
  doorMat
);
door.position.set(0,1.8,-7);
door.castShadow = true;
scene.add(door);

/* ================= HAND ================= */
const hand = new THREE.Mesh(
  new THREE.BoxGeometry(.18,.28,.45),
  new THREE.MeshStandardMaterial({
    color:0x8a6a55,
    roughness:0.55
  })
);
hand.position.set(.42,-.42,-1);
camera.add(hand);

/* ================= STATE ================= */
let started=false;
let enterTime=0;
let dragged=false;
let blackout=0;

/* ================= ENTER ================= */
function enterGame(){
  if(started) return;
  started=true;
  statusEl.textContent="Connected";
  overlay.classList.add("fade");
  document.documentElement.requestFullscreen?.();
  canvas.requestPointerLock?.();
  enterTime=performance.now();
}

/* ================= DRAG ================= */
function triggerDrag(){
  if(dragged) return;
  dragged=true;
  blackout=performance.now();
}

/* ================= INPUT ================= */
addEventListener("keydown",e=>{
  if(e.code==="Space") enterGame();
});

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now()/1000;

  // Subtle light flicker
  ceilingLight.intensity =
    18 +
    Math.sin(now*6)*0.7 +
    Math.sin(now*17)*0.3;

  if(started){
    const t=(performance.now()-enterTime)/1000;

    camera.position.z =
      THREE.MathUtils.lerp(9,4,Math.min(t/2,1));

    camera.position.y =
      1.7 + Math.sin(now*0.6)*0.02;

    hand.position.y =
      -0.42 + Math.sin(now*1.8)*0.025;

    if(camera.position.z < 5 && !dragged){
      setTimeout(triggerDrag,700);
    }
  }

  if(dragged){
    const d=(performance.now()-blackout)/1000;

    camera.position.x = Math.sin(d*14)*0.3;
    camera.rotation.z = Math.sin(d*40)*0.05;

    ceilingLight.intensity =
      THREE.MathUtils.lerp(18,0,Math.min(d/0.4,1));
    doorLight.intensity =
      THREE.MathUtils.lerp(35,0,Math.min(d/0.4,1));
    flashlight.intensity =
      THREE.MathUtils.lerp(6,0,Math.min(d/0.3,1));

    if(d>0.35){
      renderer.setClearColor(0x000000,1);
    }
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
