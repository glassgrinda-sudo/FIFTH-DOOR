<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body { margin:0; overflow:hidden; background:#000; font-family:Arial }
#ui {
  position:fixed; top:10px; left:10px;
  color:#ddd; font-size:14px; z-index:10
}
#hint {
  position:fixed; bottom:10px; width:100%;
  text-align:center; color:#888; font-size:12px
}
canvas { display:block }
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · E open door
</div>
<div id="hint">Click to lock mouse</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 3, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,0);

const light = new THREE.AmbientLight(0x404040);
scene.add(light);

/* ================= FLASHLIGHT ================= */
const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI/6, 0.5);
flashlight.visible = true;
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= INPUT ================= */
let locked = false;
canvas.addEventListener("click", () => canvas.requestPointerLock());
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === canvas;
});

let yaw = 0, pitch = 0;
document.addEventListener("mousemove", e => {
  if (!locked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

/* ================= MOVEMENT ================= */
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyF") flashlight.visible = !flashlight.visible;
});
addEventListener("keyup", e => keys[e.code] = false);

const velocity = new THREE.Vector3();
const speed = 3;

/* ================= COLLISION ================= */
const walls = [];
function wall(w,h,d,x,y,z){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color:0x1a1a1a })
  );
  m.position.set(x,y,z);
  scene.add(m);
  walls.push(m);
}

/* ================= ROOMS + CORRIDOR ================= */
function room(cx, cz){
  wall(6,3,0.2, cx,1.5,cz-3);
  wall(6,3,0.2, cx,1.5,cz+3);
  wall(0.2,3,6, cx-3,1.5,cz);
  wall(0.2,3,6, cx+3,1.5,cz);
}

room(0,0);
room(0,-8);

// corridor
wall(0.2,3,2, -1,1.5,-4);
wall(0.2,3,2,  1,1.5,-4);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(1,2.5,0.1),
  new THREE.MeshStandardMaterial({ color:0x4a0e0e })
);
door.position.set(0,1.25,-3);
scene.add(door);

let doorOpen = false;
addEventListener("keydown", e => {
  if (e.code === "KeyE") {
    if (camera.position.distanceTo(door.position) < 2) {
      doorOpen = !doorOpen;
      door.rotation.y = doorOpen ? Math.PI/2 : 0;
    }
  }
});

/* ================= COLLISION CHECK ================= */
function blocked(pos){
  for (const w of walls) {
    const box = new THREE.Box3().setFromObject(w);
    if (box.containsPoint(pos)) return true;
  }
  if (!doorOpen) {
    const box = new THREE.Box3().setFromObject(door);
    if (box.containsPoint(pos)) return true;
  }
  return false;
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  velocity.set(0,0,0);
  if (keys.KeyW) velocity.z -= 1;
  if (keys.KeyS) velocity.z += 1;
  if (keys.KeyA) velocity.x -= 1;
  if (keys.KeyD) velocity.x += 1;

  velocity.normalize().multiplyScalar(speed * dt);
  velocity.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  const next = camera.position.clone().add(velocity);
  if (!blocked(next)) camera.position.copy(next);

  renderer.render(scene, camera);
}
animate();

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
