<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR – Core Build</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
}
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #aaa;
  font-family: Arial, sans-serif;
  font-size: 14px;
  z-index: 10;
}
</style>
</head>
<body>

<div id="ui">WASD move · Mouse look · E open door · F flashlight</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 5, 25);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

/* ================= PLAYER ================= */
const player = {
  height: 1.6,
  speed: 4,
  sprint: 6,
  velocity: new THREE.Vector3()
};

camera.position.set(0, player.height, 0);

/* ================= MOUSE LOOK (FIXED) ================= */
let yaw = 0;
let pitch = 0;

const pitchObject = new THREE.Object3D();
pitchObject.add(camera);

const yawObject = new THREE.Object3D();
yawObject.add(pitchObject);
scene.add(yawObject);

document.body.addEventListener("click", () => {
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== document.body) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;

  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

  yawObject.rotation.y = yaw;
  pitchObject.rotation.x = pitch;
});

/* ================= FLASHLIGHT ================= */
const flashlight = new THREE.SpotLight(
  0xffffff,
  2,
  15,
  Math.PI / 6,
  0.4,
  1
);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);

let flashlightOn = true;

/* ================= WORLD GEOMETRY ================= */
const colliders = [];

function wall(x, y, z, w, h, d) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  mesh.position.set(x, y + h / 2, z);
  scene.add(mesh);
  colliders.push(mesh);
}

function floor(x, z, w, d) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.1, d),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  mesh.position.set(x, 0, z);
  scene.add(mesh);
}

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x404040));

/* ================= MAP ================= */
/* Room 1 */
floor(0, 0, 6, 6);
wall(-3, 0, 0, 0.2, 3, 6);
wall(3, 0, 0, 0.2, 3, 6);
wall(0, 0, -3, 6, 3, 0.2);

/* Corridor */
floor(0, -6, 2, 6);
wall(-1, 0, -6, 0.2, 3, 6);
wall(1, 0, -6, 0.2, 3, 6);

/* Room 2 */
floor(0, -12, 6, 6);
wall(-3, 0, -12, 0.2, 3, 6);
wall(3, 0, -12, 0.2, 3, 6);
wall(0, 0, -15, 6, 3, 0.2);

/* ================= DOOR ================= */
const doorPivot = new THREE.Object3D();
doorPivot.position.set(0, 0, -3);
scene.add(doorPivot);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(1, 2.5, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x552222 })
);
door.position.set(0.5, 1.25, 0);
doorPivot.add(door);

let doorOpen = false;

/* ================= INPUT ================= */
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;

  if (e.code === "KeyF") {
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 2 : 0;
  }

  if (e.code === "KeyE") {
    doorOpen = !doorOpen;
  }
});
window.addEventListener("keyup", e => keys[e.code] = false);

/* ================= COLLISION ================= */
function collide(nextPos) {
  const box = new THREE.Box3().setFromCenterAndSize(
    nextPos,
    new THREE.Vector3(0.6, player.height, 0.6)
  );

  for (const c of colliders) {
    const cBox = new THREE.Box3().setFromObject(c);
    if (box.intersectsBox(cBox)) return true;
  }
  return false;
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  /* Door animation */
  doorPivot.rotation.y += ((doorOpen ? -Math.PI / 2 : 0) - doorPivot.rotation.y) * 0.1;

  /* Movement */
  const dir = new THREE.Vector3();
  const speed = keys["ShiftLeft"] ? player.sprint : player.speed;

  if (keys["KeyW"]) dir.z -= 1;
  if (keys["KeyS"]) dir.z += 1;
  if (keys["KeyA"]) dir.x -= 1;
  if (keys["KeyD"]) dir.x += 1;

  dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const move = dir.multiplyScalar(speed * dt);

  const nextPos = yawObject.position.clone().add(move);
  nextPos.y = 0;

  if (!collide(new THREE.Vector3(nextPos.x, player.height / 2, nextPos.z))) {
    yawObject.position.copy(nextPos);
  }

  renderer.render(scene, camera);
}

animate();

/* ================= RESIZE ================= */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
