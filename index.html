<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, sans-serif;
}
canvas { display:block; }

#overlay {
  position:fixed;
  inset:0;
  background:#000;
  color:#ccc;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}
#overlay.hidden {
  display:none;
}

#ui {
  position:absolute;
  top:15px;
  left:15px;
  color:#aaa;
  font-size:14px;
  z-index:5;
}
</style>
</head>
<body>

<div id="overlay">
  <h2>FIFTH DOOR</h2>
  <p>Click to enter</p>
  <small>WASD Move · Mouse Look · F Flashlight · Shift Sprint · Esc Menu</small>
</div>

<div id="ui">
  WASD Move · Mouse Look · F Flashlight · Shift Sprint · Esc Menu
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 3, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2, 15, Math.PI/6, 0.4);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);

let flashlightOn = true;

/* ================= SIMPLE MAP ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a });

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.2), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

wall(10,3,0,1.5,-5);
wall(10,3,0,1.5,5);
wall(10,3,-5,1.5,0,Math.PI/2);
wall(10,3,5,1.5,0,Math.PI/2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(10,10),
  new THREE.MeshStandardMaterial({ color:0x0f0f0f })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= POINTER LOCK ================= */
let pointerLocked = false;

overlay.addEventListener("click", ()=>{
  canvas.requestPointerLock();
});

document.addEventListener("pointerlockchange", ()=>{
  pointerLocked = document.pointerLockElement === canvas;
  overlay.classList.toggle("hidden", pointerLocked);
});

/* ================= MOUSE LOOK ================= */
let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", e=>{
  if(!pointerLocked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

/* ================= MOVEMENT ================= */
const keys = {};
let speed = 2.5;
let sprint = false;

addEventListener("keydown", e=>{
  keys[e.code] = true;

  if(e.code === "ShiftLeft") sprint = true;

  if(e.code === "KeyF"){
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 2 : 0;
  }

  if(e.code === "Escape"){
    document.exitPointerLock();
  }
});

addEventListener("keyup", e=>{
  keys[e.code] = false;
  if(e.code === "ShiftLeft") sprint = false;
});

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if(pointerLocked){
    const moveSpeed = (sprint ? 5 : speed) * dt;
    const dir = new THREE.Vector3();

    if(keys["KeyW"]) dir.z -= moveSpeed;
    if(keys["KeyS"]) dir.z += moveSpeed;
    if(keys["KeyA"]) dir.x -= moveSpeed;
    if(keys["KeyD"]) dir.x += moveSpeed;

    dir.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    camera.position.add(dir);
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
