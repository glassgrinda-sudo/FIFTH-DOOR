<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR – Stable Build</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas { display: block; }
#hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: #aaa;
  font-family: Arial, sans-serif;
  font-size: 14px;
  opacity: 0.7;
}
</style>
</head>
<body>
<div id="hint">Click to lock mouse • WASD move • Mouse look • E open door • F flashlight</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 5, 25);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2.4, 15, Math.PI/7, 0.4);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= INPUT ================= */
let locked = false;
let yaw = 0;
let pitch = 0;
const keys = {};

document.body.addEventListener("click", () => {
  canvas.requestPointerLock();
});

document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === canvas;
});

document.addEventListener("mousemove", e => {
  if (!locked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
});

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

/* ================= WORLD ================= */
const colliders = [];
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const ceilMat  = new THREE.MeshStandardMaterial({ color: 0x0d0d0d });

function wall(w,h,d,x,y,z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
  m.position.set(x,y,z);
  scene.add(m);
  colliders.push(m);
}

function floor(w,d,x,z) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d), floorMat);
  f.position.set(x,0,z);
  scene.add(f);
}

function ceiling(w,d,x,z) {
  const c = new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d), ceilMat);
  c.position.set(x,3,z);
  scene.add(c);
}

/* ================= MAP ================= */
/* Room A */
floor(6,6,0,0);
ceiling(6,6,0,0);
wall(6,3,0.2,0,1.5,-3);
wall(6,3,0.2,0,1.5,3);
wall(0.2,3,6,-3,1.5,0);
wall(0.2,3,6,3,1.5,0);

/* Corridor */
floor(2,4,0,-5);
ceiling(2,4,0,-5);
wall(0.2,3,4,-1,1.5,-5);
wall(0.2,3,4,1,1.5,-5);

/* Room B */
floor(6,6,0,-10);
ceiling(6,6,0,-10);
wall(6,3,0.2,0,1.5,-13);
wall(6,3,0.2,0,1.5,-7);
wall(0.2,3,6,-3,1.5,-10);
wall(0.2,3,6,3,1.5,-10);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(1,2.4,0.1),
  new THREE.MeshStandardMaterial({ color: 0x552222 })
);
door.position.set(0,1.2,-3);
scene.add(door);

let doorOpen = false;
document.addEventListener("keydown", e => {
  if (e.code === "KeyE") {
    const dist = camera.position.distanceTo(door.position);
    if (dist < 2) doorOpen = !doorOpen;
  }
});

/* ================= COLLISION ================= */
function blocked(pos) {
  for (const c of colliders) {
    const box = new THREE.Box3().setFromObject(c);
    if (box.containsPoint(pos)) return true;
  }
  if (!doorOpen) {
    const dbox = new THREE.Box3().setFromObject(door);
    if (dbox.containsPoint(pos)) return true;
  }
  return false;
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  camera.rotation.set(pitch, yaw, 0);

  let move = new THREE.Vector3();
  if (keys["KeyW"]) move.z -= 1;
  if (keys["KeyS"]) move.z += 1;
  if (keys["KeyA"]) move.x -= 1;
  if (keys["KeyD"]) move.x += 1;

  move.normalize().applyEuler(camera.rotation).multiplyScalar(dt * 3);
  const next = camera.position.clone().add(move);
  if (!blocked(next)) camera.position.copy(next);

  if (doorOpen && door.rotation.y > -Math.PI/2)
    door.rotation.y -= dt * 2;
  if (!doorOpen && door.rotation.y < 0)
    door.rotation.y += dt * 2;

  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
