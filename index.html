<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:monospace;
}
canvas { display:block; }
#hud {
  position:fixed;
  top:10px; left:10px;
  color:#fff;
  font-size:14px;
  z-index:10;
}
#hint {
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  color:#aaa;
  font-size:13px;
}
</style>
</head>
<body>

<div id="hud">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · Shift sprint · Esc unlock
</div>
<div id="hint">Click to lock mouse</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155/examples/js/controls/PointerLockControls.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 2, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0,1.6,5);

const controls = new THREE.PointerLockControls(camera, document.body);
scene.add(camera);

/* ================= INPUT ================= */
document.body.addEventListener("click", ()=>controls.lock());

const keys = {};
addEventListener("keydown", e=>{
  keys[e.code]=true;
  if(e.code==="KeyF") toggleFlashlight();
});
addEventListener("keyup", e=>keys[e.code]=false);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x404040, 0.4));

const flashlight = new THREE.SpotLight(0xffffff, 3, 15, Math.PI/7, 0.4, 1);
flashlight.visible = false;
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);

function toggleFlashlight(){
  flashlight.visible = !flashlight.visible;
}

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({color:0x222222, roughness:0.9});
const floorMat = new THREE.MeshStandardMaterial({color:0x111111});

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.2), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// hallway
wall(20,4,0,2,-10);
wall(20,4,0,2,10);
wall(20,4,-10,2,0,Math.PI/2);
wall(20,4,10,2,0,Math.PI/2);

/* ================= CLOSET DRAGGER (1) ================= */
const dragger = new THREE.Mesh(
  new THREE.BoxGeometry(0.6,1.8,0.6),
  new THREE.MeshStandardMaterial({color:0x550000})
);
dragger.position.set(3,0.9,-3);
scene.add(dragger);

let dragged=false;
let dragTimer=0;

/* ================= PSYCHO ROOM (2) ================= */
const psychoRoom = new THREE.Mesh(
  new THREE.BoxGeometry(3,3,3),
  new THREE.MeshStandardMaterial({color:0x111133, emissive:0x000022})
);
psychoRoom.position.set(-4,1.5,-4);
scene.add(psychoRoom);

/* ================= MAIN ENEMY (4) ================= */
const enemy = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4,1.2,4,8),
  new THREE.MeshStandardMaterial({color:0x111111, emissive:0x220000})
);
enemy.position.set(0,0.9,-8);
scene.add(enemy);

let enemyState="patrol";

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  /* movement */
  let speed = keys["ShiftLeft"] ? 6 : 3;
  if(keys["KeyW"]) controls.moveForward(speed*dt);
  if(keys["KeyS"]) controls.moveForward(-speed*dt);
  if(keys["KeyA"]) controls.moveRight(-speed*dt);
  if(keys["KeyD"]) controls.moveRight(speed*dt);

  /* closet dragger logic */
  const d = camera.position.distanceTo(dragger.position);
  if(d<1.2 && !dragged){
    dragged=true;
    dragTimer=0;
  }
  if(dragged){
    dragTimer+=dt;
    camera.position.lerp(dragger.position,0.05);
    flashlight.visible=false;
    if(dragTimer>1.5){
      dragged=false;
    }
  }

  /* psycho room distortion */
  const pr = camera.position.distanceTo(psychoRoom.position);
  if(pr<2){
    camera.rotation.z = Math.sin(performance.now()*0.002)*0.05;
  } else {
    camera.rotation.z = 0;
  }

  /* enemy patrol + chase */
  const ed = camera.position.distanceTo(enemy.position);
  if(ed<6){
    enemyState="chase";
  } else {
    enemyState="patrol";
  }

  if(enemyState==="patrol"){
    enemy.position.x = Math.sin(performance.now()*0.001)*4;
  } else {
    enemy.position.lerp(camera.position,0.01);
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
