<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const statusEl = document.getElementById("status");

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050505, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.06);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 1.65, 8);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.4));

const mainLight = new THREE.PointLight(0xfff2cc, 0.6, 20);
mainLight.position.set(0, 3, 0);
scene.add(mainLight);

/* ================= MATERIAL ================= */
const wallMat = new THREE.MeshStandardMaterial({
  color:0x1c1c1c,
  roughness:0.95
});

/* ================= HALLWAY (PLANES, NOT BOX) ================= */
const leftWall = new THREE.Mesh(
  new THREE.PlaneGeometry(12,4),
  wallMat
);
leftWall.position.set(-2,2,-2);
leftWall.rotation.y = Math.PI/2;
scene.add(leftWall);

const rightWall = leftWall.clone();
rightWall.position.x = 2;
rightWall.rotation.y = -Math.PI/2;
scene.add(rightWall);

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(4,4),
  wallMat
);
backWall.position.set(0,2,-8);
scene.add(backWall);

/* ================= FLOOR ================= */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4,12),
  new THREE.MeshStandardMaterial({ color:0x141414, roughness:0.9 })
);
floor.rotation.x = -Math.PI/2;
floor.position.set(0,0,-2);
scene.add(floor);

/* ================= DOOR ================= */
const door = new THREE.Mesh(
  new THREE.BoxGeometry(2,3.5,0.25),
  new THREE.MeshStandardMaterial({ color:0x4a0e0e, roughness:0.7 })
);
door.position.set(0,1.75,-6);
scene.add(door);

/* ================= HAND ================= */
const hand = new THREE.Mesh(
  new THREE.BoxGeometry(0.2,0.3,0.5),
  new THREE.MeshStandardMaterial({ color:0x7a5a4a })
);
hand.position.set(0.4,-0.4,-1);
camera.add(hand);

/* ================= STATE ================= */
let started = false;
let enterTime = 0;

/* ================= ENTER ================= */
function enterGame(){
  if(started) return;
  started = true;
  statusEl.textContent = "Connected";
  overlay.classList.add("fade");
  enterTime = performance.now();
}

/* ================= INPUT ================= */
addEventListener("keydown", e=>{
  if(e.code === "Space") enterGame();
});

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);

  if(started){
    const t = (performance.now() - enterTime) / 1000;
    camera.position.z = THREE.MathUtils.lerp(8,3,Math.min(t/2,1));
    mainLight.intensity = THREE.MathUtils.lerp(0.6,1.4,Math.min(t/2,1));
    hand.position.y = -0.4 + Math.sin(t*1.5)*0.02;
  }

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
