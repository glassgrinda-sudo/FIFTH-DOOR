<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: monospace;
}
canvas { display: block; }

#ui {
  position: fixed;
  top: 12px;
  left: 12px;
  color: #ddd;
  font-size: 13px;
  z-index: 10;
  line-height: 1.4;
}
</style>
</head>

<body>
<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · Shift sprint · E door · Esc unlock
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ==================== CORE ==================== */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 3, 25);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

/* ==================== LIGHT ==================== */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2.2, 18, Math.PI / 7, 0.4);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

let flashlightOn = true;

/* ==================== PLAYER ==================== */
const player = {
  velocity: new THREE.Vector3(),
  speed: 3,
  sprint: 5,
  yaw: 0,
  pitch: 0
};

/* ==================== INPUT ==================== */
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;

  if (e.code === "KeyF") {
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 2.2 : 0;
  }
});
addEventListener("keyup", e => keys[e.code] = false);

renderer.domElement.addEventListener("click", () => {
  renderer.domElement.requestPointerLock();
});

addEventListener("mousemove", e => {
  if (document.pointerLockElement !== renderer.domElement) return;

  player.yaw -= e.movementX * 0.002;
  player.pitch -= e.movementY * 0.002;

  player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));

  camera.rotation.set(player.pitch, player.yaw, 0);
});

/* ==================== WORLD ==================== */
const colliders = [];

function wall(w, h, d, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 })
  );
  mesh.position.set(x, y + h / 2, z);
  scene.add(mesh);
  colliders.push(mesh);
}

function floor(w, d, x, z) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0, z);
  scene.add(mesh);
}

/* ===== Rooms & Corridors ===== */
floor(8, 8, 0, 0);
wall(8, 3, 0.2, 0, 0, -4);
wall(8, 3, 0.2, 0, 0, 4);
wall(0.2, 3, 8, -4, 0, 0);
wall(0.2, 3, 8, 4, 0, 0);

floor(4, 8, 0, -10);
wall(4, 3, 0.2, 0, 0, -14);
wall(0.2, 3, 8, -2, 0, -10);
wall(0.2, 3, 8, 2, 0, -10);

/* ==================== DOORS ==================== */
const doors = [];

function door(x, z) {
  const pivot = new THREE.Object3D();
  pivot.position.set(x - 0.5, 0, z);
  scene.add(pivot);

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(1, 2.4, 0.15),
    new THREE.MeshStandardMaterial({ color: 0x552222 })
  );
  mesh.position.set(0.5, 1.2, 0);
  pivot.add(mesh);

  doors.push({ pivot, open: false });
  colliders.push(mesh);
}

door(0, -4);

/* ==================== DOOR INTERACTION ==================== */
addEventListener("keydown", e => {
  if (e.code !== "KeyE") return;

  doors.forEach(d => {
    const dist = d.pivot.position.distanceTo(camera.position);
    if (dist < 2) d.open = !d.open;
  });
});

/* ==================== MOVEMENT ==================== */
function move(dt) {
  const dir = new THREE.Vector3();
  const speed = keys["ShiftLeft"] ? player.sprint : player.speed;

  if (keys["KeyW"]) dir.z -= 1;
  if (keys["KeyS"]) dir.z += 1;
  if (keys["KeyA"]) dir.x -= 1;
  if (keys["KeyD"]) dir.x += 1;

  dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
  camera.position.addScaledVector(dir, speed * dt);
}

/* ==================== LOOP ==================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  move(dt);

  doors.forEach(d => {
    const target = d.open ? -Math.PI / 2 : 0;
    d.pivot.rotation.y += (target - d.pivot.rotation.y) * 0.15;
  });

  renderer.render(scene, camera);
}

animate();

/* ==================== RESIZE ==================== */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
