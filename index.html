<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body { margin:0; padding:0; overflow:hidden; background:black; }
#ui {
  position:fixed;
  top:10px; left:10px;
  color:#eee;
  font-family:monospace;
  font-size:14px;
  z-index:10;
}
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · E open door
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 5, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0,1.6,4);

/* ================= LIGHTS ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI/6, 0.4);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= PLAYER ================= */
let yaw = 0;
let pitch = 0;
const velocity = new THREE.Vector3();
const speed = 4;

/* ================= POINTER LOCK ================= */
canvas.addEventListener("click", () => canvas.requestPointerLock());

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== canvas) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;

  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

  camera.rotation.set(pitch, yaw, 0);
});

/* ================= INPUT ================= */
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;

  if (e.code === "KeyF") flashlight.visible = !flashlight.visible;
  if (e.code === "KeyE") tryOpenDoor();
});
addEventListener("keyup", e => keys[e.code] = false);

/* ================= COLLISION ================= */
const colliders = [];
function addCollider(mesh) {
  colliders.push(mesh);
}

/* ================= GEOMETRY ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x222222 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111 });

function wall(w,h,d,x,y,z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
  m.position.set(x,y,z);
  scene.add(m);
  addCollider(m);
}

/* Floor */
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(10,0.1,10),
  floorMat
);
floor.position.y = -0.05;
scene.add(floor);
addCollider(floor);

/* Room */
wall(10,3,0.2,0,1.5,-5);
wall(0.2,3,10,-5,1.5,0);
wall(0.2,3,10,5,1.5,0);

/* Corridor */
wall(4,3,0.2,0,1.5,5);
wall(0.2,3,4,-2,1.5,7);
wall(0.2,3,4,2,1.5,7);

/* ================= DOOR ================= */
let doorOpen = false;
const door = new THREE.Mesh(
  new THREE.BoxGeometry(1.5,2.5,0.2),
  new THREE.MeshStandardMaterial({ color:0x550000 })
);
door.position.set(0,1.25,-5);
scene.add(door);
addCollider(door);

function tryOpenDoor() {
  if (doorOpen) return;
  if (camera.position.distanceTo(door.position) < 2) {
    door.rotation.y = Math.PI/2;
    doorOpen = true;
    colliders.splice(colliders.indexOf(door),1);
  }
}

/* ================= MOVEMENT ================= */
const raycaster = new THREE.Raycaster();

function move(dt) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();

  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));

  velocity.set(0,0,0);
  if (keys["KeyW"]) velocity.add(dir);
  if (keys["KeyS"]) velocity.sub(dir);
  if (keys["KeyA"]) velocity.sub(right);
  if (keys["KeyD"]) velocity.add(right);

  velocity.normalize().multiplyScalar(speed * dt);

  const nextPos = camera.position.clone().add(velocity);

  for (const c of colliders) {
    const box = new THREE.Box3().setFromObject(c);
    if (box.containsPoint(nextPos)) return;
  }

  camera.position.copy(nextPos);
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  move(clock.getDelta());
  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
