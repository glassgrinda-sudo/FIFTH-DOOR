<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
canvas { display: block; }

#ui {
  position: absolute;
  top: 15px;
  left: 15px;
  color: #bbb;
  background: rgba(0,0,0,0.6);
  padding: 10px 14px;
  border-radius: 4px;
  z-index: 10;
}
</style>
</head>

<body>
<div id="ui">
  <b>FIFTH DOOR</b><br>
  WASD Move · Mouse Look · F Flashlight · Shift Sprint
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155/examples/js/controls/PointerLockControls.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.065);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);

/* ================= CONTROLS ================= */
const controls = new THREE.PointerLockControls(camera, document.body);
document.body.addEventListener("click", () => controls.lock());
scene.add(controls.getObject());

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222, 0.25));

/* 🔦 FLASHLIGHT (SLIGHTLY BRIGHTER – LOCKED CHANGE) */
const flashlight = new THREE.SpotLight(
  0xffffff,
  2.8,        // ← increased from 2.0
  18,         // ← increased from 15
  Math.PI / 6,
  0.4,
  1.2
);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a1a,
  roughness: 0.9
});
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x121212,
  roughness: 0.95
});

/* ================= ROOM ================= */
function room(x, z) {
  const g = new THREE.Group();

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), floorMat);
  floor.rotation.x = -Math.PI / 2;
  g.add(floor);

  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), wallMat);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = 4;
  g.add(ceiling);

  const walls = [
    [0, 2, -5, 0],
    [0, 2, 5, Math.PI],
    [-5, 2, 0, Math.PI / 2],
    [5, 2, 0, -Math.PI / 2]
  ];

  walls.forEach(w => {
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMat);
    wall.position.set(w[0], w[1], w[2]);
    wall.rotation.y = w[3];
    g.add(wall);
  });

  g.position.set(x, 0, z);
  scene.add(g);
}

room(0, 0);

/* ================= MOVEMENT ================= */
const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

let velocity = new THREE.Vector3();
const clock = new THREE.Clock();

/* ================= LOOP ================= */
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  velocity.set(0, 0, 0);
  const speed = keys["ShiftLeft"] ? 6 : 3;

  if (keys["KeyW"]) velocity.z -= speed * dt;
  if (keys["KeyS"]) velocity.z += speed * dt;
  if (keys["KeyA"]) velocity.x -= speed * dt;
  if (keys["KeyD"]) velocity.x += speed * dt;

  controls.moveRight(velocity.x);
  controls.moveForward(velocity.z);

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
