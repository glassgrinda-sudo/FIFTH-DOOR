<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155/examples/js/controls/PointerLockControls.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 1, 18);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0,1.6,5);

const controls = new THREE.PointerLockControls(camera, document.body);
scene.add(controls.getObject());

document.body.addEventListener("click",()=>controls.lock());

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x222222,0.3));

const flashlight = new THREE.SpotLight(0xffffff,2,12,Math.PI/7,0.4,1);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);

/* ================= ENV ================= */
const wallMat = new THREE.MeshStandardMaterial({color:0x1c1c1c});
const floorMat = new THREE.MeshStandardMaterial({color:0x111111});

function room(x,z,w,d,psych=false){
  const g = new THREE.Group();

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w,d), floorMat);
  floor.rotation.x=-Math.PI/2;
  g.add(floor);

  const wall1 = new THREE.Mesh(new THREE.PlaneGeometry(w,3), wallMat);
  wall1.position.set(0,1.5,-d/2);
  g.add(wall1);

  const wall2 = wall1.clone();
  wall2.position.z=d/2;
  wall2.rotation.y=Math.PI;
  g.add(wall2);

  const wall3 = new THREE.Mesh(new THREE.PlaneGeometry(d,3), wallMat);
  wall3.position.set(-w/2,1.5,0);
  wall3.rotation.y=Math.PI/2;
  g.add(wall3);

  const wall4 = wall3.clone();
  wall4.position.x=w/2;
  wall4.rotation.y=-Math.PI/2;
  g.add(wall4);

  g.position.set(x,0,z);
  scene.add(g);

  if(psych){
    psychRooms.push({group:g,time:Math.random()*10});
  }
}

room(0,0,6,6);
room(8,0,6,6,true);
room(-8,0,6,6);
room(0,-8,6,6,true);

/* ================= MOVEMENT ================= */
const keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let velocity=new THREE.Vector3();

/* ================= PSYCHOLOGICAL ROOMS ================= */
const psychRooms=[];
function updatePsych(dt){
  psychRooms.forEach(r=>{
    r.time+=dt;
    r.group.children.forEach(m=>{
      if(m.geometry && m.geometry.attributes.position){
        const pos=m.geometry.attributes.position;
        for(let i=0;i<pos.count;i++){
          const y=Math.sin(r.time+i)*0.002;
          pos.setY(i,pos.getY(i)+y);
        }
        pos.needsUpdate=true;
      }
    });
  });
}

/* ================= CLOSET DRAGGER ================= */
const closetZones=[
  new THREE.Box3(
    new THREE.Vector3(-1,0,-1),
    new THREE.Vector3(1,2,1)
  )
];

let dragCooldown=0;

function checkClosetDrag(dt){
  if(dragCooldown>0){
    dragCooldown-=dt;
    return;
  }

  const p = controls.getObject().position;
  closetZones.forEach(z=>{
    if(z.containsPoint(p)){
      dragCooldown=5;
      // yank
      const dir = new THREE.Vector3(
        (Math.random()-.5)*2,
        0,
        (Math.random()-.5)*2
      );
      velocity.add(dir.multiplyScalar(2));
      camera.rotation.z = (Math.random()-.5)*0.2;
      setTimeout(()=>camera.rotation.z=0,400);
    }
  });
}

/* ================= LOOP ================= */
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();

  velocity.x -= velocity.x * 6 * dt;
  velocity.z -= velocity.z * 6 * dt;

  if(keys["KeyW"]) velocity.z -= 6*dt;
  if(keys["KeyS"]) velocity.z += 6*dt;
  if(keys["KeyA"]) velocity.x -= 6*dt;
  if(keys["KeyD"]) velocity.x += 6*dt;

  controls.moveRight(-velocity.x);
  controls.moveForward(-velocity.z);

  updatePsych(dt);
  checkClosetDrag(dt);

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
