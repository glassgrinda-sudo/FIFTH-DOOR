<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body { margin:0; padding:0; overflow:hidden; background:#000; }
#ui {
  position:fixed;
  top:10px; left:10px;
  color:#eee;
  font-family:monospace;
  font-size:14px;
  z-index:10;
}
</style>
</head>
<body>

<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · Shift sprint · F flashlight · E open door
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155/examples/js/controls/PointerLockControls.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 18);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ================= CONTROLS ================= */
const controls = new THREE.PointerLockControls(camera, document.body);
document.body.addEventListener("click",()=>controls.lock());

let move = { f:0,b:0,l:0,r:0 };
let sprint=false;

/* ================= INPUT ================= */
addEventListener("keydown",e=>{
  if(e.code==="KeyW") move.f=1;
  if(e.code==="KeyS") move.b=1;
  if(e.code==="KeyA") move.l=1;
  if(e.code==="KeyD") move.r=1;
  if(e.code==="ShiftLeft") sprint=true;
});
addEventListener("keyup",e=>{
  if(e.code==="KeyW") move.f=0;
  if(e.code==="KeyS") move.b=0;
  if(e.code==="KeyA") move.l=0;
  if(e.code==="KeyD") move.r=0;
  if(e.code==="ShiftLeft") sprint=false;
});

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff,2,12,Math.PI/7,0.5);
flashlight.visible=true;
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

addEventListener("keydown",e=>{
  if(e.code==="KeyF") flashlight.visible=!flashlight.visible;
});

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1b1b1b });
const floorMat = new THREE.MeshStandardMaterial({ color:0x111111 });
const doorMat = new THREE.MeshStandardMaterial({ color:0x551111 });

/* ================= COLLISION ================= */
const colliders=[];

/* ================= ROOM BUILDER ================= */
function wall(w,h,x,y,z,ry=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.2),wallMat);
  m.position.set(x,y,z);
  m.rotation.y=ry;
  scene.add(m);
  colliders.push(m);
}

function room(x,z){
  const h=3;
  wall(6,h,x,1.5,z-3);
  wall(6,h,x,1.5,z+3);
  wall(6,h,x-3,1.5,z,Math.PI/2);
  wall(6,h,x+3,1.5,z,Math.PI/2);

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(6,6),floorMat);
  floor.rotation.x=-Math.PI/2;
  floor.position.set(x,0,z);
  scene.add(floor);

  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(6,6),floorMat);
  ceil.rotation.x=Math.PI/2;
  ceil.position.set(x,3,z);
  scene.add(ceil);
}

room(0,0);
room(0,-6);

/* ================= DOOR ================= */
let doorOpen=false;
const doorPivot=new THREE.Object3D();
doorPivot.position.set(0,0,-3);
scene.add(doorPivot);

const door=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.5,0.15),doorMat);
door.position.set(0.6,1.25,0);
doorPivot.add(door);

addEventListener("keydown",e=>{
  if(e.code==="KeyE"){
    if(camera.position.distanceTo(doorPivot.position)<2){
      doorOpen=!doorOpen;
    }
  }
});

/* ================= MOVEMENT + COLLISION ================= */
const ray=new THREE.Raycaster();
const clock=new THREE.Clock();

function collide(dir){
  ray.set(camera.position,dir);
  const hit=ray.intersectObjects(colliders);
  return hit.length && hit[0].distance<0.4;
}

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  const speed=(sprint?4:2)*dt;

  const forward=new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y=0;
  forward.normalize();

  const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0));

  if(move.f&&!collide(forward)) camera.position.addScaledVector(forward,speed);
  if(move.b&&!collide(forward.clone().negate())) camera.position.addScaledVector(forward,-speed);
  if(move.l&&!collide(right.clone().negate())) camera.position.addScaledVector(right,-speed);
  if(move.r&&!collide(right)) camera.position.addScaledVector(right,speed);

  doorPivot.rotation.y+=((doorOpen?-Math.PI/2:0)-doorPivot.rotation.y)*0.1;

  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
