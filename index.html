<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family: monospace;
}
canvas { display:block; }

#hud {
  position:absolute;
  top:10px; left:10px;
  color:#ccc;
  font-size:13px;
  z-index:10;
}
#hint {
  position:absolute;
  bottom:10px;
  width:100%;
  text-align:center;
  color:#777;
  font-size:12px;
}
</style>
</head>
<body>

<div id="hud">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · E open door
</div>
<div id="hint">Click to lock mouse</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 2, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0,1.6,0);

const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2.5, 15, Math.PI/7, 0.4);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ================= MATERIALS ================= */
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9 });
const floorMat = new THREE.MeshStandardMaterial
