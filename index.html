<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR – Multiplayer Prototype</title>
<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  color:#ddd;
  font-family:Arial
}
#ui{
  position:absolute;
  top:10px;
  left:10px;
  z-index:10;
  background:rgba(0,0,0,0.7);
  padding:10px;
  border-radius:8px;
  width:260px
}
#log{
  font-size:11px;
  max-height:140px;
  overflow:auto;
  margin-top:6px
}
canvas{display:block}
</style>
</head>
<body>

<div id="ui">
<strong>FIFTH DOOR</strong><br>
Phase: <span id="phase">In Game</span>
<div id="log"></div>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
/* =====================
   CONFIG
===================== */
const SERVER_URL = "wss://fifth-door-server.onrender.com";

/* =====================
   UI LOG
===================== */
const logEl = document.getElementById("log");
function log(t){
  logEl.innerHTML += t + "<br>";
  logEl.scrollTop = 9999;
}

/* =====================
   AUDIO UNLOCK + KEEP ALIVE
===================== */
let audioUnlocked = false;
let ambient;

window.addEventListener("click", () => {
  if (audioUnlocked) return;

  const ctx = THREE.AudioContext.getContext();
  if (ctx.state === "suspended") ctx.resume();

  const listener = new THREE.AudioListener();
  camera.add(listener);

  ambient = new THREE.Audio(listener);
  const osc = listener.context.createOscillator();
  osc.frequency.value = 30;
  osc.start();
  ambient.setNodeSource(osc);
  ambient.setVolume(0.02);

  audioUnlocked = true;
  log("Audio unlocked");
});

/* =====================
   NETWORK
===================== */
let socket, playerId;
let players = {};

socket = new WebSocket(SERVER_URL);

socket.onopen = () => log("Connected to server");

socket.onmessage = e => {
  const data = JSON.parse(e.data);

  if (data.type === "init") {
    playerId = data.id;
    players = data.players;
    log("You joined the game");
  }

  if (data.type === "players") {
    players = data.players;
  }
};

socket.onerror = () => log("WebSocket error");

   THREE.JS SETUP
=====================
