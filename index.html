<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{display:block}
#ui{
  position:absolute;
  top:10px;
  left:10px;
  color:#0f0;
  font-family:monospace;
  z-index:10;
}
</style>
</head>
<body>

<div id="ui">
WASD move | Mouse look | Shift sprint | F flashlight | Esc menu
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 5);
scene.add(camera);

/* ================= LIGHTING (FIX BLACK SCREEN) ================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const ceilingLight = new THREE.PointLight(0xffffff, 1.2, 30);
ceilingLight.position.set(0, 4, 0);
scene.add(ceilingLight);

const flashlight = new THREE.SpotLight(0xffffff, 2, 20, Math.PI/6, 0.3);
flashlight.visible = true;
camera.add(flashlight);
camera.add(flashlight.target);

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({color:0x666666});
const floorMat = new THREE.MeshStandardMaterial({color:0x333333});

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.2), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

function floor(w,d,x,z){
  const f = new THREE.Mesh(new THREE.PlaneGeometry(w,d), floorMat);
  f.rotation.x = -Math.PI/2;
  f.position.set(x,0,z);
  scene.add(f);
}

floor(20,20,0,0);
wall(20,4,0,2,-10);
wall(20,4,0,2,10);
wall(20,4,-10,2,0,Math.PI/2);
wall(20,4,10,2,0,Math.PI/2);

/* ================= PSYCHOLOGICAL ROOM (A2) ================= */
const psychoRoom = new THREE.Mesh(
  new THREE.BoxGeometry(4,4,4),
  new THREE.MeshStandardMaterial({color:0x440000})
);
psychoRoom.position.set(6,2,6);
scene.add(psychoRoom);

/* ================= CLOSET DRAGGER (A1) ================= */
const dragger = new THREE.Mesh(
  new THREE.BoxGeometry(0.6,1.8,0.6),
  new THREE.MeshStandardMaterial({color:0x000000})
);
dragger.position.set(-6,0.9,-6);
scene.add(dragger);

/* ================= MAIN ENEMY (A4) ================= */
const enemy = new THREE.Mesh(
  new THREE.BoxGeometry(1,2,1),
  new THREE.MeshStandardMaterial({color:0x111111})
);
enemy.position.set(0,1,-8);
scene.add(enemy);
let enemyDir = 1;

/* ================= FAKE LOBBY SIM (A3) ================= */
console.log("Lobby:");
["Alex","Jamie","Chris","Morgan","???"].forEach(n=>{
  console.log(n + " joined");
});

/* ================= CONTROLS ================= */
const keys = {};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

let yaw=0, pitch=0;
document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==canvas) return;
  yaw -= e.movementX*0.002;
  pitch -= e.movementY*0.002;
  pitch = Math.max(-1.5, Math.min(1.5,pitch));
  camera.rotation.set(pitch,yaw,0);
});

canvas.addEventListener("click",()=>canvas.requestPointerLock());

/* ================= GAME LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  let speed = keys["ShiftLeft"] ? 6 : 3;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();

  if(keys["KeyW"]) camera.position.addScaledVector(dir, speed*dt);
  if(keys["KeyS"]) camera.position.addScaledVector(dir, -speed*dt);
  if(keys["KeyA"]) camera.position.addScaledVector(new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),dir), speed*dt);
  if(keys["KeyD"]) camera.position.addScaledVector(new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)), speed*dt);

  if(keys["KeyF"]) flashlight.visible = true;

  /* Enemy patrol */
  enemy.position.x += enemyDir * dt * 2;
  if(Math.abs(enemy.position.x)>6) enemyDir *= -1;

  /* Dragger proximity */
  if(camera.position.distanceTo(dragger.position)<1.2){
    camera.position.set(0,1.6,5); // dragged away
    console.log("You were dragged.");
  }

  /* Psychological room effect */
  if(camera.position.distanceTo(psychoRoom.position)<3){
    ceilingLight.intensity = 0.3;
    renderer.setClearColor(0x220000,1);
  }else{
    ceilingLight.intensity = 1.2;
    renderer.setClearColor(0x000000,1);
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
