<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR – WALKABLE BUILD</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{display:block}
#hint{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  color:#ccc;
  font-family:monospace;
  font-size:14px;
  opacity:.7;
}
</style>
</head>
<body>

<div id="hint">Click to lock mouse • WASD move • Shift sprint • F flashlight • Esc unlock</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x111111, 1);

const scene = new THREE.Scene();

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHTING (CRITICAL FIX) ================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const flashlight = new THREE.SpotLight(0xffffff, 2, 15, Math.PI/7, 0.4);
flashlight.visible = true;
camera.add(flashlight);
camera.add(flashlight.target);

/* ================= SIMPLE BUILDING ================= */
const wallMat = new THREE.MeshStandardMaterial({color:0x2a2a2a});
const floorMat = new THREE.MeshStandardMaterial({color:0x1a1a1a});

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.2), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}
function floor(w,d,x,z){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d), floorMat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x,0,z);
  scene.add(m);
}

floor(20,20,0,0);
wall(20,4,0,2,-10);
wall(20,4,0,2,10);
wall(20,4,-10,2,0,Math.PI/2);
wall(20,4,10,2,0,Math.PI/2);

/* ================= PLACEHOLDER ROOMS ================= */
const psychRoom = new THREE.Mesh(
  new THREE.BoxGeometry(4,3,4),
  new THREE.MeshStandardMaterial({color:0x330000})
);
psychRoom.position.set(5,1.5,-5);
scene.add(psychRoom);

/* ================= MAIN ENEMY (PATROL) ================= */
const enemy = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4,1.2,4,8),
  new THREE.MeshStandardMaterial({color:0x550000})
);
enemy.position.set(-5,1,-5);
scene.add(enemy);

let enemyDir = 1;

/* ================= FAKE PLAYER ================= */
const fakePlayer = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.3,1.4,4,8),
  new THREE.MeshStandardMaterial({color:0x444444})
);
fakePlayer.position.set(0,1,-3);
scene.add(fakePlayer);

/* ================= CONTROLS ================= */
let keys = {};
let yaw = 0, pitch = 0;
let velocity = new THREE.Vector3();
let sprint = false;

document.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="ShiftLeft") sprint=true;
  if(e.code==="KeyF") flashlight.visible=!flashlight.visible;
});
document.addEventListener("keyup",e=>{
  keys[e.code]=false;
  if(e.code==="ShiftLeft") sprint=false;
});

/* ================= POINTER LOCK ================= */
canvas.addEventListener("click",()=>canvas.requestPointerLock());

document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==canvas) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  /* Movement */
  const speed = sprint ? 6 : 3;
  velocity.set(0,0,0);
  if(keys["KeyW"]) velocity.z -= speed*dt;
  if(keys["KeyS"]) velocity.z += speed*dt;
  if(keys["KeyA"]) velocity.x -= speed*dt;
  if(keys["KeyD"]) velocity.x += speed*dt;
  velocity.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  camera.position.add(velocity);

  /* Enemy patrol */
  enemy.position.x += enemyDir * dt * 1.5;
  if(enemy.position.x> -2 || enemy.position.x<-8) enemyDir*=-1;

  /* Psychological room distortion */
  const dist = camera.position.distanceTo(psychRoom.position);
  if(dist<4){
    camera.rotation.z = Math.sin(performance.now()*0.002)*0.05;
  } else {
    camera.rotation.z = 0;
  }

  renderer.render(scene, camera);
}

animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
