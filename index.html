<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>

<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
canvas { display:block; }

#hud {
  position:absolute;
  top:16px;
  left:16px;
  color:#ccc;
  font-size:14px;
  z-index:5;
}

#overlay {
  position:fixed;
  inset:0;
  background:#000;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:20px;
  z-index:10;
  cursor:pointer;
}
.hidden { display:none; }

#menu {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  color:#ccc;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:20;
}
</style>
</head>

<body>

<div id="hud">
<b>FIFTH DOOR</b><br>
WASD Move · Mouse Look · F Flashlight · Shift Sprint · Esc Menu
</div>

<div id="overlay">
CLICK TO ENTER<br>
<small>You shouldn’t be alone.</small>
</div>

<div id="menu">
PAUSED<br><br>
WASD Move<br>
Mouse Look<br>
F Flashlight<br>
Shift Sprint<br>
Esc Resume
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const menu = document.getElementById("menu");

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x020202);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020202, 0.06);

/* ================= CAMERA ================= */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x222222,0.4));

const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI/7, 0.5, 1);
flashlight.position.set(0,1.6,0);
flashlight.target.position.set(0,1.6,-1);
camera.add(flashlight);
camera.add(flashlight.target);
let flashlightOn = true;

/* ================= ENVIRONMENT ================= */
const wallMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.9});
const floorMat = new THREE.MeshStandardMaterial({color:0x121212, roughness:1});

function wall(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  scene.add(m);
}

wall(20,4,0,2,-10);
wall(20,4,0,2,10,Math.PI);
wall(20,4,-10,2,0,Math.PI/2);
wall(20,4,10,2,0,-Math.PI/2);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ================= CLOSET DRAGGER ================= */
const dragger = new THREE.Mesh(
  new THREE.BoxGeometry(0.5,1.7,0.5),
  new THREE.MeshStandardMaterial({color:0x550000})
);
dragger.position.set(3,0.85,-3);
scene.add(dragger);

/* ================= CONTROLS ================= */
let locked=false, paused=false;
let yaw=0, pitch=0;
const keys = {};

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Escape"){
    paused = !paused;
    menu.style.display = paused ? "flex":"none";
    if(paused) document.exitPointerLock();
    else canvas.requestPointerLock();
  }
  if(e.code==="KeyF"){
    flashlightOn = !flashlightOn;
    flashlight.intensity = flashlightOn ? 2 : 0;
  }
});

addEventListener("keyup",e=>keys[e.code]=false);

canvas.addEventListener("click",()=>{
  canvas.requestPointerLock();
});

document.addEventListener("pointerlockchange",()=>{
  locked = document.pointerLockElement === canvas;
  overlay.classList.add("hidden");
});

addEventListener("mousemove",e=>{
  if(!locked || paused) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.5,Math.min(1.5,pitch));
});

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if(locked && !paused){
    camera.rotation.set(pitch,yaw,0);

    let speed = keys["ShiftLeft"] ? 4 : 2;
    const dir = new THREE.Vector3();

    if(keys["KeyW"]) dir.z -= 1;
    if(keys["KeyS"]) dir.z += 1;
    if(keys["KeyA"]) dir.x -= 1;
    if(keys["KeyD"]) dir.x += 1;

    dir.normalize().applyEuler(camera.rotation);
    camera.position.addScaledVector(dir, dt*speed);

    // Proximity horror
    if(camera.position.distanceTo(dragger.position) < 1.5){
      camera.position.x += Math.sin(performance.now()*0.05)*0.1;
      flashlight.intensity = Math.random()>0.7 ? 0 : 2;
    }
  }

  renderer.render(scene,camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
