<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}
#hint {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #aaa;
  font-family: Arial, sans-serif;
  font-size: 14px;
  z-index: 10;
}
</style>
</head>
<body>
<div id="hint">Click to lock mouse · WASD move · Shift sprint · F flashlight</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ===================== BASIC SETUP ===================== */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x050505);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 5, 30);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

/* ===================== PLAYER ===================== */
const player = {
  position: new THREE.Vector3(0, 1.6, 0),
  velocity: new THREE.Vector3(),
  speed: 3,
  sprint: 5,
  yaw: 0,
  pitch: 0
};

camera.position.copy(player.position);

/* ===================== LIGHTING ===================== */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(
  0xffffff,
  3.2,      // brighter but still moody
  20,
  Math.PI / 6,
  0.4,
  1
);
flashlight.visible = true;
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

/* ===================== MATERIALS ===================== */
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1b });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x090909 });

/* ===================== COLLISION ===================== */
const colliders = [];

function solidBox(w, h, d, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    wallMat
  );
  mesh.position.set(x, y, z);
  scene.add(mesh);
  colliders.push(mesh);
}

function floorPlane(w, d, x, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.1, d),
    floorMat
  );
  mesh.position.set(x, 0, z);
  scene.add(mesh);
}

function ceilingPlane(w, d, x, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.1, d),
    ceilingMat
  );
  mesh.position.set(x, 3, z);
  scene.add(mesh);
}

/* ===================== MAP LAYOUT ===================== */
/*
Layout:
[ Room A ] -- hallway -- [ Room B ]
                 |
               hallway
                 |
              [ Room C ]
*/

function buildRoom(cx, cz) {
  floorPlane(6, 6, cx, cz);
  ceilingPlane(6, 6, cx, cz);

  solidBox(6, 3, 0.3, cx, 1.5, cz - 3);
  solidBox(6, 3, 0.3, cx, 1.5, cz + 3);
  solidBox(0.3, 3, 6, cx - 3, 1.5, cz);
  solidBox(0.3, 3, 6, cx + 3, 1.5, cz);
}

function buildHallway(x1, z1, x2, z2) {
  const dx = x2 - x1;
  const dz = z2 - z1;
  const len = Math.sqrt(dx*dx + dz*dz);

  floorPlane(2, len, (x1+x2)/2, (z1+z2)/2);
  ceilingPlane(2, len, (x1+x2)/2, (z1+z2)/2);

  solidBox(0.3, 3, len, (x1+x2)/2 - 1, 1.5, (z1+z2)/2);
  solidBox(0.3, 3, len, (x1+x2)/2 + 1, 1.5, (z1+z2)/2);
}

/* Rooms */
buildRoom(0, 0);
buildRoom(10, 0);
buildRoom(10, -10);

/* Hallways */
buildHallway(3, 0, 7, 0);
buildHallway(10, -3, 10, -7);

/* ===================== INPUT ===================== */
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

document.addEventListener("click", () => {
  canvas.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== canvas) return;

  player.yaw -= e.movementX * 0.002;
  player.pitch -= e.movementY * 0.002;

  player.pitch = Math.max(
    -Math.PI / 2 + 0.01,
     Math.PI / 2 - 0.01
  );
});

document.addEventListener("keydown", e => {
  if (e.code === "KeyF") flashlight.visible = !flashlight.visible;
});

/* ===================== COLLISION CHECK ===================== */
function intersects(pos) {
  const box = new THREE.Box3().setFromCenterAndSize(
    new THREE.Vector3(pos.x, 1.6, pos.z),
    new THREE.Vector3(0.6, 1.6, 0.6)
  );

  return colliders.some(c => {
    const cBox = new THREE.Box3().setFromObject(c);
    return box.intersectsBox(cBox);
  });
}

/* ===================== LOOP ===================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  const speed = keys["ShiftLeft"] ? player.sprint : player.speed;

  const forward = new THREE.Vector3(
    Math.sin(player.yaw),
    0,
    Math.cos(player.yaw)
  );
  const right = new THREE.Vector3(
    Math.cos(player.yaw),
    0,
   -Math.sin(player.yaw)
  );

  const move = new THREE.Vector3();
  if (keys["KeyW"]) move.add(forward);
  if (keys["KeyS"]) move.sub(forward);
  if (keys["KeyA"]) move.sub(right);
  if (keys["KeyD"]) move.add(right);

  move.normalize().multiplyScalar(speed * dt);

  const nextPos = player.position.clone().add(move);
  if (!intersects(nextPos)) player.position.copy(nextPos);

  camera.position.copy(player.position);
  camera.rotation.order = "YXZ";
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  flashlight.position.set(0, 0, 0);
  flashlight.target.position.set(0, 0, -1);

  renderer.render(scene, camera);
}

animate();

/* ===================== RESIZE ===================== */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
