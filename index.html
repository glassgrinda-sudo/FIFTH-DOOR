<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: monospace;
}
#ui {
  position: absolute;
  top: 12px;
  left: 12px;
  color: #ccc;
  z-index: 10;
  font-size: 14px;
}
#hint {
  position: absolute;
  bottom: 14px;
  width: 100%;
  text-align: center;
  color: #777;
  font-size: 12px;
}
</style>
</head>
<body>

<div id="ui">
  <b>FIFTH DOOR</b><br>
  WASD move · Mouse look · F flashlight · E open door
</div>
<div id="hint">Click to lock mouse</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x050505);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505, 2, 25);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);

/* ================= LIGHTING ================= */
scene.add(new THREE.AmbientLight(0x222222));

const flashlight = new THREE.SpotLight(0xffffff, 2.5, 15, Math.PI / 7, 0.4);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

let flashlightOn = true;

/* ================= INPUT ================= */
let keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

addEventListener("click", () => {
  canvas.requestPointerLock();
});

let yaw = 0, pitch = 0;
addEventListener("mousemove", e => {
  if (document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
});

addEventListener("keydown", e => {
  if (e.code === "KeyF") flashlight.visible = !flashlight.visible;
});

/* ================= GEOMETRY HELPERS ================= */
const colliders = [];
const doors = [];

function wall(w, h, d, x, y, z) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
  );
  m.position.set(x, y + h / 2, z);
  scene.add(m);
  colliders.push(m);
}

function floor(w, d, x, z) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.1, d),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  m.position.set(x, 0, z);
  scene.add(m);
}

function door(x, z) {
  const pivot = new THREE.Object3D();
  pivot.position.set(x - 0.5, 0, z);
  scene.add(pivot);

  const d = new THREE.Mesh(
    new THREE.BoxGeometry(1, 2, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x551111 })
  );
  d.position.set(0.5, 1, 0);
  pivot.add(d);

  doors.push({ pivot, open: false, mesh: d });
  colliders.push(d);
}

/* ================= MAP LAYOUT ================= */
/* Room 1 */
floor(6, 6, 0, 0);
wall(6, 3, 0.2, 0, 0, -3);
wall(6, 3, 0.2, 0, 0, 3);
wall(0.2, 3, 6, -3, 0, 0);
wall(0.2, 3, 2, 3, 0, -2);
wall(0.2, 3, 2, 3, 0, 2);

/* Corridor */
floor(4, 2, 5, 0);
wall(4, 3, 0.2, 5, 0, -1);
wall(4, 3, 0.2, 5, 0, 1);

/* Room 2 */
floor(6, 6, 10, 0);
wall(6, 3, 0.2, 10, 0, -3);
wall(6, 3, 0.2, 10, 0, 3);
wall(0.2, 3, 6, 7, 0, 0);
wall(0.2, 3, 6, 13, 0, 0);

/* Doors */
door(3, 0);
door(7, 0);

/* ================= PLAYER ================= */
const player = {
  pos: new THREE.Vector3(0, 1.6, 0),
  radius: 0.3,
  speed: 3
};

/* ================= COLLISION ================= */
function blocked(nextPos) {
  for (const c of colliders) {
    const box = new THREE.Box3().setFromObject(c);
    const p = nextPos.clone();
    p.y = box.min.y + 1;
    if (box.distanceToPoint(p) < player.radius) return true;
  }
  return false;
}

/* ================= DOOR INTERACTION ================= */
addEventListener("keydown", e => {
  if (e.code !== "KeyE") return;
  for (const d of doors) {
    const dist = d.pivot.position.distanceTo(player.pos);
    if (dist < 1.5) {
      d.open = !d.open;
    }
  }
});

/* ================= LOOP ================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  let move = new THREE.Vector3();
  if (keys.KeyW) move.z -= 1;
  if (keys.KeyS) move.z += 1;
  if (keys.KeyA) move.x -= 1;
  if (keys.KeyD) move.x += 1;
  move.normalize();

  move.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  const next = player.pos.clone().add(move.multiplyScalar(player.speed * dt));

  if (!blocked(next)) player.pos.copy(next);

  camera.position.copy(player.pos);

  for (const d of doors) {
    d.pivot.rotation.y += ((d.open ? -Math.PI/2 : 0) - d.pivot.rotation.y) * 0.1;
  }

  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
