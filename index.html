<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FIFTH DOOR</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, sans-serif;
}
canvas { display:block; }

#overlay {
  position:fixed;
  inset:0;
  background:#000;
  color:#ccc;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:10;
}

#lobby {
  width:300px;
  text-align:left;
}

.player {
  display:flex;
  justify-content:space-between;
  margin:6px 0;
  opacity:0.8;
}

.mic {
  width:10px;
  height:10px;
  border-radius:50%;
  background:#333;
}

.mic.talk {
  background:#0f0;
}

#hint {
  margin-top:20px;
  font-size:14px;
  opacity:0.6;
}
</style>
</head>

<body>
<div id="overlay">
  <h2>LOBBY</h2>
  <div id="lobby"></div>
  <div id="hint">Press ENTER to start</div>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================= BASIC SETUP ================= */
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const lobbyEl = document.getElementById("lobby");

const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 2, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.6,5);
scene.add(camera);

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0x404040,0.4));

const flashlight = new THREE.SpotLight(0xffffff, 2, 10, Math.PI/7, 0.4);
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);

/* ================= MAP ================= */
const colliders = [];
const wallMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a });

function wall(x,z,w,d){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,3,d), wallMat);
  m.position.set(x,1.5,z);
  scene.add(m);
  colliders.push(m);
}

wall(0,-5,10,0.5);
wall(0,5,10,0.5);
wall(-5,0,0.5,10);
wall(5,0,0.5,10);

/* ================= LOBBY SIM ================= */
const fakeNames = ["Alex","Jordan","Chris","Taylor","Morgan","Riley"];
const lobbyPlayers = [];

fakeNames.forEach(name=>{
  const div = document.createElement("div");
  div.className="player";
  div.innerHTML = `<span>${name}</span><div class="mic"></div>`;
  lobbyEl.appendChild(div);
  lobbyPlayers.push(div);
});

setInterval(()=>{
  lobbyPlayers.forEach(p=>{
    p.querySelector(".mic").classList.toggle("talk", Math.random()<0.2);
  });
},400);

/* ================= INPUT ================= */
let started=false;
let keys={};
let yaw=0, pitch=0;

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Enter" && !started){
    started=true;
    overlay.style.display="none";
    canvas.requestPointerLock();
  }
});
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
  if(!started) return;
  yaw -= e.movementX * 0.002;   // FIXED (not inverted)
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2,pitch));
  camera.rotation.set(pitch,yaw,0);
});

/* ================= MOVEMENT + COLLISION ================= */
function collide(pos){
  for(const c of colliders){
    const b = new THREE.Box3().setFromObject(c);
    if(b.containsPoint(pos)) return true;
  }
  return false;
}

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if(started){
    const dir = new THREE.Vector3();
    if(keys.KeyW) dir.z-=1;
    if(keys.KeyS) dir.z+=1;
    if(keys.KeyA) dir.x-=1;
    if(keys.KeyD) dir.x+=1;

    dir.normalize().applyEuler(camera.rotation).multiplyScalar(dt*3);

    const next = camera.position.clone().add(dir);
    if(!collide(next)) camera.position.copy(next);
  }

  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
