<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFTH DOOR</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: monospace;
}
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #ccc;
  z-index: 10;
  font-size: 14px;
}
canvas { display: block; }
</style>
</head>

<body>
<div id="ui">
<b>FIFTH DOOR</b><br>
WASD move · Mouse look · F flashlight · E open door
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>

<script>
/* ================== BASIC SETUP ================== */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.08);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1.6, 0);

const yawObject = new THREE.Object3D();
const pitchObject = new THREE.Object3D();
yawObject.add(pitchObject);
pitchObject.add(camera);
scene.add(yawObject);

/* ================== LIGHTING ================== */
scene.add(new THREE.AmbientLight(0x222222, 0.4));

const flashlight = new THREE.SpotLight(0xffffff, 2, 12, Math.PI / 6, 0.4, 1);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);

/* ================== INPUT ================== */
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

document.body.addEventListener("click", () => {
  document.body.requestPointerLock();
});

let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== document.body) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  yawObject.rotation.y = yaw;
  pitchObject.rotation.x = pitch;
});

/* ================== WORLD GEOMETRY ================== */
const colliders = [];
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

function wall(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  m.position.set(x, y, z);
  scene.add(m);
  colliders.push(m);
}

function floor(w, d, x, z) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), floorMat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0, z);
  scene.add(m);
}

/* ===== ROOM 1 ===== */
floor(8, 8, 0, 0);
wall(8, 3, 0.2, 0, 1.5, -4);
wall(8, 3, 0.2, 0, 1.5, 4);
wall(0.2, 3, 8, -4, 1.5, 0);

/* Door cutout wall */
wall(0.2, 3, 3, 4, 1.5, -2.5);
wall(0.2, 3, 3, 4, 1.5, 2.5);

/* Corridor */
floor(4, 6, 6, 0);
wall(4, 3, 0.2, 6, 1.5, -3);
wall(4, 3, 0.2, 6, 1.5, 3);

/* Room 2 */
floor(8, 8, 10, 0);
wall(8, 3, 0.2, 10, 1.5, -4);
wall(8, 3, 0.2, 10, 1.5, 4);
wall(0.2, 3, 8, 14, 1.5, 0);

/* ================== DOOR ================== */
const doorPivot = new THREE.Object3D();
doorPivot.position.set(4, 0, 0);
scene.add(doorPivot);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(0.1, 2.5, 2),
  new THREE.MeshStandardMaterial({ color: 0x4a0e0e })
);
door.position.set(0, 1.25, 0);
doorPivot.add(door);

let doorOpen = false;
document.addEventListener("keydown", e => {
  if (e.code === "KeyE") doorOpen = !doorOpen;
});

/* ================== MOVEMENT ================== */
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
const speed = 3;
const raycaster = new THREE.Raycaster();

function move(dt) {
  direction.set(0, 0, 0);
  if (keys["KeyW"]) direction.z -= 1;
  if (keys["KeyS"]) direction.z += 1;
  if (keys["KeyA"]) direction.x -= 1;
  if (keys["KeyD"]) direction.x += 1;
  direction.normalize();

  velocity.copy(direction).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  velocity.multiplyScalar(speed * dt);

  const nextPos = yawObject.position.clone().add(velocity);

  raycaster.set(nextPos, new THREE.Vector3(0, -1, 0));
  const hits = raycaster.intersectObjects(colliders, true);
  if (hits.length === 0) yawObject.position.copy(nextPos);
}

/* ================== LOOP ================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  move(dt);

  doorPivot.rotation.y += ((doorOpen ? -Math.PI/2 : 0) - doorPivot.rotation.y) * 0.1;

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
